<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:BC;font-weight:900;font-style:italic;src:url(../fonts/barlow-condensed-latin-900-italic.woff2)}
@font-face{font-family:BC;font-weight:900;font-style:italic;src:url(../fonts/barlow-condensed-latin-ext-900-italic.woff2);unicode-range:U+0100-024F}
html,body{margin:0;width:1024px;height:1024px;overflow:hidden}
#i{width:1024px;height:1024px;position:relative;background:radial-gradient(circle at 50% 38%,#ffcf3a 0,#ffb21a 36%,#f07a12 70%,#d9480a 100%);overflow:hidden}
.ray{position:absolute;left:50%;top:38%;width:2000px;height:2000px;margin:-1000px 0 0 -1000px;background:repeating-conic-gradient(rgba(255,255,255,.14) 0 10deg,transparent 10deg 20deg)}
.roof{position:absolute;left:0;right:0;bottom:0;height:300px;background:#e22511;clip-path:polygon(0 30%,16% 0,16% 30%,33% 0,33% 30%,50% 0,50% 30%,67% 0,67% 30%,84% 0,84% 30%,100% 0,100% 100%,0 100%)}
img{position:absolute;left:50%;top:80px;width:640px;margin-left:-320px;filter:drop-shadow(0 18px 0 rgba(120,30,0,.35))}
.t{position:absolute;left:0;right:0;bottom:70px;text-align:center;font:italic 900 210px BC;color:#fff;letter-spacing:4px;text-shadow:0 10px 0 #7a0d05}
</style></head><body><div id="i"><div class="ray"></div><img src="logo.webp"><div class="roof"></div><div class="t">FABRİKA</div></div></body></html>
