<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#7fc8f0">
<title>Flix Fabrika</title>
<style>
/*FONTS*/
:root{--navy:#0b1f3f;--yel:#ffd84a;--disp:BC,'Arial Narrow',Impact,sans-serif;--body:R,system-ui,-apple-system,sans-serif;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#8fd0f2;font-family:var(--body);color:#fff;touch-action:none;overscroll-behavior:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#money{position:fixed;left:14px;top:calc(var(--st) + 12px);display:flex;align-items:center;gap:7px;padding:5px 14px 5px 5px;border-radius:22px;background:rgba(11,31,63,.55);transform-origin:left center;pointer-events:none}
#money i{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bff59a,#3faa3a 60%,#257a24);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:16px;color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
#money b{font-family:var(--disp);font-style:italic;font-weight:900;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.25)}
#snd{position:fixed;right:14px;top:calc(var(--st) + 12px);width:40px;height:40px;border-radius:20px;background:rgba(11,31,63,.45);display:flex;align-items:center;justify-content:center}
#snd svg .x{display:none}#snd.off svg .w{display:none}#snd.off svg .x{display:block}
#goal{position:fixed;left:50%;top:calc(var(--st) + 64px);transform:translate(-50%,-6px);padding:8px 16px;border-radius:16px;background:rgba(255,255,255,.92);color:var(--navy);font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.18);opacity:0;transition:.3s;pointer-events:none}
#goal.show{opacity:1;transform:translate(-50%,0)}
#toast{position:fixed;left:50%;top:calc(var(--st) + 110px);transform:translate(-50%,-8px);padding:9px 16px;border-radius:16px;background:rgba(11,31,63,.78);font-size:14px;font-weight:700;opacity:0;transition:.35s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#joy{position:fixed;left:0;top:0;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55);opacity:0;pointer-events:none;transition:opacity .15s}
#joy.on{opacity:1}
#joyk{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.25)}
#cap{position:fixed;left:0;top:0;padding:3px 9px;border-radius:10px;background:#e22511;color:#fff;font-family:var(--disp);font-style:italic;font-weight:900;font-size:16px;letter-spacing:.5px;pointer-events:none;opacity:0;transition:opacity .2s}
.bub{position:fixed;left:0;top:0;padding:4px 9px 4px 8px;border-radius:14px;background:#fff;color:var(--navy);display:flex;align-items:center;gap:4px;font-size:16px;box-shadow:0 4px 10px rgba(0,0,0,.2);pointer-events:none;white-space:nowrap}
.bub::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
.bub b{font-family:var(--disp);font-style:italic;font-weight:900;font-size:19px;line-height:1}
.bub .fl{display:block;width:20px;height:20px;background:url(/*LOGO*/) center/contain no-repeat}
.bub.ok{background:#3faa3a;font-size:18px}.bub.ok::after{border-top-color:#3faa3a}
#gems{position:fixed;left:14px;top:calc(var(--st) + 54px);display:flex;align-items:center;gap:6px;padding:3px 12px 3px 4px;border-radius:18px;background:rgba(11,31,63,.45);pointer-events:none}
#gems i{font-style:normal;font-size:16px;width:24px;text-align:center}#gems b{font-family:var(--disp);font-style:italic;font-weight:900;font-size:20px;line-height:1}
#lvl{position:fixed;left:14px;top:calc(var(--st) + 88px);padding:3px 10px;border-radius:12px;background:rgba(11,31,63,.45);font-weight:800;font-size:12px;pointer-events:none;display:flex;gap:6px;align-items:center}#lvl i{display:block;width:60px;height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}#lvl i u{display:block;height:100%;background:#ffc20e}
.bub.truck{background:#0b2a5e;color:#fff}.bub.truck::after{border-top-color:#0b2a5e}
#vipTag{position:fixed;left:14px;top:calc(var(--st) + 116px);padding:2px 8px;border-radius:8px;background:#ffc20e;color:#3b2508;font-weight:800;font-size:11px;pointer-events:none}
.fab{position:fixed;right:14px;width:64px;height:64px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18),0 10px 20px rgba(0,0,0,.18);transition:transform .1s}
.fab:active{transform:translateY(3px)}.fab b{font-family:var(--disp);font-style:italic;font-weight:900;font-size:22px;line-height:1}.fab small{font-size:10px;font-weight:700;margin-top:2px;opacity:.95}
#boostB{bottom:calc(var(--sb) + 104px);background:linear-gradient(#9b7bff,#5a36e0)}#boostB.on{background:linear-gradient(#3fe07a,#18a04a)}
#shopB{bottom:calc(var(--sb) + 26px);background:linear-gradient(#ffd84a,#f0a020);color:#3b2508}
body.panel .fab,body.panel #hint{opacity:0;pointer-events:none}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:58vh;display:flex;flex-direction:column;padding:12px 12px calc(var(--sb) + 12px);border-radius:24px 24px 0 0;background:#fff;color:var(--navy);box-shadow:0 -10px 30px rgba(0,0,0,.2);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1.1)}
#sheet.show{transform:none}
#shHd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}#shT{font-family:var(--disp);font-style:italic;font-weight:900;font-size:28px}
#shX{width:40px;height:40px;border-radius:14px;background:#eef2f8;font-size:18px;font-weight:800;color:var(--navy)}
#shTabs{display:flex;gap:6px;margin-bottom:8px}#shTabs:empty{display:none}.tb{flex:1;padding:9px 0;border-radius:12px;background:#eef2f8;font-weight:700;font-size:13px;color:var(--navy)}.tb.on{background:var(--navy);color:#fff}
#shBody{overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:7px;padding-bottom:4px}
.row{display:flex;align-items:center;gap:9px;padding:8px;border-radius:16px;background:#f4f6fb}.row.hot{background:#fff6d6}.row.free{background:#efeaff}
.ic{width:42px;height:42px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.ic .sw{display:block;width:30px;height:30px;border-radius:9px}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.mid b{font-size:14px;font-weight:800}.mid span{font-size:11.5px;opacity:.7;font-weight:500}
.mid em{font-style:normal;font-size:10px;font-weight:800;color:#fff;background:#e22511;padding:1px 6px;border-radius:6px;margin-left:3px;vertical-align:2px}
.buy{min-width:84px;height:44px;padding:0 10px;border-radius:14px;background:linear-gradient(#5fe08a,#25a855);color:#fff;font-family:var(--disp);font-style:italic;font-weight:900;font-size:18px;box-shadow:0 4px 0 #1a7a3e;flex:0 0 auto;white-space:nowrap}
.buy.no{background:#c9d1df;box-shadow:0 4px 0 #a8b2c4}.buy.max{background:#e9edf4;color:#8a96ab;box-shadow:none}.buy.alt{background:linear-gradient(#5aa8ff,#2a74dc);box-shadow:0 4px 0 #1d55a8}.buy.iap{background:linear-gradient(#ffd84a,#f0a020);color:#3b2508;box-shadow:0 4px 0 #b9770c}
.buy:disabled{opacity:.8}.buy:active:not(:disabled){transform:translateY(2px)}
.ad{width:52px;height:44px;border-radius:14px;background:linear-gradient(#9b7bff,#5a36e0);color:#fff;font-weight:900;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 #3d1fa8;flex:0 0 auto;line-height:1}
.ad small{font-size:8.5px;font-weight:700;margin-top:2px}
.note{font-size:12px;opacity:.65;text-align:center;padding:6px}
.set{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 2px;font-size:12px}.set button{padding:9px 12px;border-radius:12px;background:#eef2f8;font-weight:700;font-size:12.5px;color:var(--navy)}.set span{opacity:.6}
#modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,10,25,.5);opacity:0;pointer-events:none;transition:.25s}#modal.show{opacity:1;pointer-events:auto}
#mCard{position:relative;width:100%;max-width:360px;border-radius:26px;padding:26px 20px 18px;background:#fff;color:var(--navy);text-align:center}
#mBody .big{font-size:44px}#mBody b{font-size:18px}#mBody small{opacity:.7}#mBody .amt{font-family:var(--disp);font-style:italic;font-weight:900;font-size:44px;color:#25a855;margin:8px 0}
#mBtns{display:flex;flex-direction:column;gap:8px;margin-top:14px}#mBtns button{height:50px;border-radius:16px;font-family:var(--disp);font-style:italic;font-weight:900;font-size:20px}
#mOk{background:#eef2f8;color:var(--navy)}#mAlt{background:linear-gradient(#9b7bff,#5a36e0);color:#fff;box-shadow:0 4px 0 #3d1fa8}
#mX{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:12px;background:#eef2f8;color:var(--navy);font-weight:800}
#adL{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,#e22511,#7a0d05);color:#fff;text-align:center}#adL.show{display:flex}
#adL img{width:150px;height:150px}#adL h2{font-family:var(--disp);font-style:italic;font-weight:900;font-size:40px;line-height:.95}#adL p{opacity:.85;font-size:14px}
#adKind{position:absolute;left:16px;top:calc(var(--st) + 16px);font-size:11px;font-weight:800;letter-spacing:1.5px;opacity:.8}
#adX{position:absolute;right:16px;top:calc(var(--st) + 12px);width:42px;height:42px;border-radius:21px;background:rgba(0,0,0,.35);font-weight:800;font-size:16px}
.bub.call{background:#e22511;color:#fff;animation:pulse .7s infinite alternate}.bub.call::after{border-top-color:#e22511}.bub.call b{font-size:15px}
@keyframes pulse{to{transform:scale(1.08)}}
#hint{position:fixed;left:0;right:90px;bottom:calc(var(--sb) + 26px);text-align:center;font-weight:700;font-size:13px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.35);opacity:.9;pointer-events:none;transition:opacity .5s}
body.moved #hint{opacity:0}

/* ===== 1.2 tasarım dili: kırmızı başlık, krem panel, kalın kenarlı kartlar, alt gölgeli butonlar ===== */
:root{--red:#e22511;--cream:#fff7e8;--line:#ecdcc0}
#money,#gems,#lvl{background:rgba(11,31,63,.62);border:2px solid rgba(255,255,255,.85);box-shadow:0 3px 0 rgba(0,0,0,.18)}
#lvl{top:calc(var(--st) + 92px)}#lvl i u{background:linear-gradient(90deg,#ffd84a,#ff9a1a)}
#bon{position:fixed;left:14px;top:calc(var(--st) + 124px);display:flex;flex-wrap:wrap;gap:5px;max-width:170px;pointer-events:none}
#bon span{display:flex;align-items:center;gap:5px;padding:2px 9px 2px 4px;border-radius:12px;background:var(--bc);border:2px solid #fff;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.18);animation:bpop .3s}
#bon b{font-family:var(--disp);font-style:italic;font-weight:900;font-size:16px}
@keyframes bpop{from{transform:scale(.6)}}
#vipTag{top:calc(var(--st) + 92px);left:auto;right:14px}
.fab{border:3px solid #fff}
#boostB{background:linear-gradient(#b49bff,#6a3ff0);box-shadow:0 5px 0 #3d1fa8,0 10px 18px rgba(0,0,0,.2)}#boostB.on{background:linear-gradient(#5ff08a,#1aa04a);box-shadow:0 5px 0 #127a36,0 10px 18px rgba(0,0,0,.2)}
#shopB{box-shadow:0 5px 0 #b9770c,0 10px 18px rgba(0,0,0,.2)}
#menuB{bottom:calc(var(--sb) + 182px);width:50px;height:50px;right:21px;border-radius:17px;background:linear-gradient(#24407a,#0b1f3f);box-shadow:0 4px 0 #050d1e,0 8px 14px rgba(0,0,0,.2);font-size:20px}
#sheet{z-index:30;background:var(--cream);padding:0 12px calc(var(--sb) + 12px);overflow:hidden;max-height:62vh}
#shHd{margin:0 -12px 10px;padding:12px 12px 12px 16px;background:linear-gradient(#ff3a22,#c81a0a);color:#fff;border-bottom:4px solid #8a0f04;position:relative}
#shHd::before{content:'';width:34px;height:34px;margin-right:8px;background:url(/*LOGO*/) center/contain no-repeat;flex:0 0 auto}
#shT{flex:1;text-shadow:0 3px 0 rgba(0,0,0,.25);letter-spacing:.5px}
#shX{background:rgba(255,255,255,.95);border:0;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.tb{background:#fff;border:2px solid var(--line);font-family:var(--disp);font-style:italic;font-weight:900;font-size:16px}.tb.on{background:linear-gradient(#ffe066,#ffc20e);border-color:#d99a00;color:#3b2508;box-shadow:0 3px 0 #b9770c}
.row{background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:18px}
.row.hot{background:#fff3c4;border-color:#f0c040;box-shadow:0 3px 0 #e0b030}.row.free{background:#f1ecff;border-color:#d6cbff;box-shadow:0 3px 0 #d6cbff}
.ic{background:var(--cream);border:2px solid var(--line);box-shadow:none}
.row.bonus .ic{background:var(--bc);border-color:rgba(0,0,0,.12)}.row.bonus.act{border-color:var(--bc);box-shadow:0 3px 0 var(--bc)}
.mid em.on{background:#25a855}
.bon{font-style:normal;font-size:11px;font-weight:800;color:#127a36;background:#dff7e6;padding:1px 6px;border-radius:6px}.bon.off{color:#8a96ab;background:#eef2f8}
.buy.gem{background:linear-gradient(#6ad8ff,#2a8fe0);box-shadow:0 4px 0 #1a5fa8;font-size:16px}
.set.col{flex-direction:column;align-items:stretch}.set.col button{height:50px;font-size:15px;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
#modal{z-index:40}#mCard{background:var(--cream);border:3px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.15)}
/* ana menü */
#mm{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;padding:calc(var(--st) + 26px) 20px calc(var(--sb) + 22px);background:linear-gradient(180deg,rgba(11,31,63,.82) 0%,rgba(11,31,63,0) 34%,rgba(11,31,63,0) 52%,rgba(11,31,63,.9) 82%)}
body.menu #mm{display:flex}
body.menu #money,body.menu #gems,body.menu #lvl,body.menu #vipTag,body.menu #bon,body.menu .fab,body.menu #hint,body.menu #goal,body.menu .bub,body.menu #cap,body.menu #joy{opacity:0!important;pointer-events:none!important}
body.menu #toast{top:50%}
#mmLogo{width:96px;height:96px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25));animation:mmb 2.4s ease-in-out infinite}
@keyframes mmb{50%{transform:translateY(-6px) rotate(-3deg)}}
#mm h1{font-family:var(--disp);font-style:italic;font-weight:900;font-size:64px;line-height:.9;letter-spacing:1px;color:#fff;text-shadow:0 4px 0 var(--red),0 8px 0 #7a0d05,0 12px 18px rgba(0,0,0,.35);margin-top:4px}
#mm h2{font-size:13px;font-weight:700;opacity:.9;margin-top:10px;letter-spacing:.5px}
#mmGap{flex:1}#mmEnd{margin-top:12px;padding:6px 14px;border-radius:12px;background:#7a4fd8;border:2px solid #fff;font-weight:800;font-size:12px;letter-spacing:.5px}
#mmStats{display:flex;gap:8px;margin-bottom:14px}#mmStats span{padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.5);font-weight:800;font-size:13px}
#mmPlay{width:min(300px,86vw);height:76px;border-radius:26px;background:linear-gradient(#ffe066,#ffb40e);border:4px solid #fff;box-shadow:0 7px 0 #b9770c,0 14px 24px rgba(0,0,0,.35);color:#3b2508;display:flex;align-items:center;justify-content:center;gap:10px;animation:mmp 1.4s ease-in-out infinite}
#mmPlay b{font-family:var(--disp);font-style:italic;font-weight:900;font-size:40px;letter-spacing:1px}#mmPlay i{font-style:normal;font-size:26px}
#mmPlay:active{transform:translateY(4px);box-shadow:0 3px 0 #b9770c}
@keyframes mmp{50%{transform:scale(1.04)}}
#mmTiles{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;width:min(380px,94vw);margin-top:18px}
#mmTiles button{aspect-ratio:1;border-radius:18px;background:#fff;border:3px solid #fff;box-shadow:0 5px 0 #c9b88f;color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#mmTiles button i{font-style:normal;font-size:26px}#mmTiles button small{font-family:var(--disp);font-style:italic;font-weight:900;font-size:14px}
#mmTiles button:active{transform:translateY(3px);box-shadow:0 2px 0 #c9b88f}

/* ===== 1.5: patron rozeti, sipariş kartı, müşteri sipariş rengi, uçan yazı, tanıtımlar ===== */
#pat{position:fixed;left:14px;top:calc(var(--st) + 124px);padding:3px 10px 3px 4px;border-radius:12px;background:rgba(11,31,63,.62);border:2px solid rgba(255,255,255,.85);box-shadow:0 3px 0 rgba(0,0,0,.18);font-weight:800;font-size:12px;display:flex;gap:6px;align-items:center;pointer-events:none}
#pat i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 8px rgba(255,255,255,.6)}
#bon{top:calc(var(--st) + 156px)}
#ct{position:fixed;right:14px;top:calc(var(--st) + 12px);width:min(186px,46vw);padding:6px 10px 8px;border-radius:16px;background:var(--cream);color:var(--navy);border:3px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.18);pointer-events:none;display:flex;flex-direction:column;gap:2px}
#ct small{font-family:var(--disp);font-style:italic;font-weight:900;font-size:12px;color:var(--red);letter-spacing:1px}
#ct b{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800}#ct b i{width:12px;height:12px;border-radius:50%;border:2px solid var(--navy)}
#ct u{display:block;height:7px;border-radius:4px;background:#e6dcc8;overflow:hidden}#ct u s{display:block;height:100%;background:linear-gradient(90deg,#5fe08a,#25a855)}
#ct em{font-style:normal;font-size:11px;font-weight:800;color:#127a36}
#vipTag{top:calc(var(--st) + 98px)}
.bub .od{display:block;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px rgba(11,31,63,.5);margin-left:-8px;margin-top:10px}
.bub.wait{animation:pulse .5s infinite alternate}
.ft{position:fixed;left:0;top:0;font-family:var(--disp);font-style:italic;font-weight:900;font-size:24px;text-shadow:0 2px 0 #1b1330,0 0 6px rgba(0,0,0,.4);pointer-events:none;z-index:5}
.pcard{display:flex;gap:10px;padding:10px;border-radius:18px;background:linear-gradient(135deg,#0b2a5e,#24407a);color:#fff;border:3px solid #fff;box-shadow:0 3px 0 var(--line)}
.pcard .pt{width:78px;flex:0 0 auto;border-radius:14px;background:rgba(255,255,255,.1);border:3px solid var(--pc);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0}
.pcard .pt b{font-family:var(--disp);font-style:italic;font-weight:900;font-size:38px;line-height:1;color:var(--pc)}.pcard .pt small{font-size:9px;font-weight:800;letter-spacing:.5px;opacity:.9}
.pcard .ps{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;font-size:11.5px;align-content:center}.pcard .ps b{font-family:var(--disp);font-style:italic;font-weight:900;font-size:16px;color:#ffd84a}
.promo{margin-top:4px;padding:8px;border-radius:18px;background:#fff;border:2px solid var(--line)}.promo>b{display:block;font-family:var(--disp);font-style:italic;font-weight:900;font-size:15px;color:var(--red);margin:0 0 6px 4px}
.promo>div{display:grid;grid-template-columns:1fr 1fr;gap:7px}.promo button{display:flex;align-items:center;gap:7px;padding:7px;border-radius:14px;color:#fff;text-align:left;border:2px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.2)}
