name: Direktör veri deneme
on:
  workflow_dispatch:
    inputs:
      urls:
        description: boşlukla ayrılmış adresler
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/probe.mjs ${{ github.event.inputs.urls }}
