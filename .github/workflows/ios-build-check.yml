# Builds the Kick Up and Direktör iOS apps on a Mac in the cloud on every change to their app folders, without signing.
# Shows that the Xcode projects compile; nothing is uploaded.
name: iOS build check
on:
  push:
    branches: [main]
    paths: ['app/**', 'direktor/app/**', '.github/workflows/ios-*.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dir: [app, direktor/app]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use the newest stable Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - run: npm ci
      - name: Create the iOS project
        run: npx cap add ios --packagemanager CocoaPods
      - run: python3 tools/ios_setup.py
      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -n 60
