<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#e22511">
<title>Flix Birleştir</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Rubik:wght@400;500;700;800&display=swap">
<style>
:root{--red:#e22511;--navy:#022753;--yel:#ffd41f;--cream:#fff7e6;--d:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;--b:Rubik,system-ui,-apple-system,sans-serif;
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#15306b;font-family:var(--b);color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
#gl{position:fixed;inset:0;display:block}
.d{font-family:var(--d);font-style:italic;font-weight:900;line-height:.9}
.pane{position:fixed;inset:0;padding:calc(var(--st) + 12px) max(16px,var(--sr)) calc(var(--sb) + 16px) max(16px,var(--sl))}
.pane[hidden],[hidden]{display:none!important}
button{font-family:inherit;border:0;cursor:pointer;color:inherit}
.btn{border-radius:16px;padding:14px 18px;font-family:var(--d);font-style:italic;font-weight:900;font-size:24px;letter-spacing:.3px;border:3px solid var(--navy);box-shadow:0 5px 0 var(--navy);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--navy)}
.btn.y{background:var(--yel);color:var(--navy)} .btn.w{background:#fff;color:var(--navy)} .btn.t{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);box-shadow:none;font-size:18px}
.btn.sm{font-size:16px;padding:8px 10px;border-radius:12px;box-shadow:0 3px 0 var(--navy)}
.btn[disabled]{opacity:.45}
.chip{background:rgba(2,39,83,.72);border:2px solid rgba(255,255,255,.2);border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;min-width:70px}
.chip small{font-size:10px;font-weight:700;letter-spacing:1.4px;opacity:.75;text-transform:uppercase}
.chip b{font-family:var(--d);font-style:italic;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
/* home */
#homeP{background:linear-gradient(180deg,rgba(226,37,17,.97),rgba(190,24,8,.97));display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
#homeP .top{width:100%;display:flex;justify-content:space-between;align-items:center}
#homeP .top img{height:34px}
.tuy{background:rgba(2,39,83,.35);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px}
.hero-t{font-size:clamp(54px,16vw,84px);color:#fff;text-shadow:0 5px 0 var(--navy);margin-top:4px}
.hero-t span{color:var(--yel)}
.hero-s{font-weight:500;font-size:14px;max-width:30ch;opacity:.95}
.stage{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.stage:before{content:"";position:absolute;width:min(70vw,300px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,212,31,.55),rgba(255,212,31,0) 70%)}
#homeToy{position:relative;width:min(62vw,280px);max-height:100%;object-fit:contain;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 14px 14px rgba(0,0,0,.3))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
.hb{display:grid;gap:12px;width:min(100%,360px)}
.hb .btn{width:100%}
.hrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:min(100%,360px)}
.hrow .btn{font-size:18px;padding:10px 6px}
.best{font-size:13px;font-weight:700;opacity:.9}
.mini{display:flex;gap:8px;align-items:center}
.mini button{background:rgba(2,39,83,.35);border-radius:12px;width:44px;height:36px;font-weight:800}
/* game */
#gameP{pointer-events:none}
#gameP .hud{pointer-events:auto}
.gtop{display:flex;align-items:center;gap:8px}
.gtop img{height:30px;margin-right:auto}
.goal{margin-top:10px;background:rgba(2,39,83,.72);border:2px solid rgba(255,255,255,.2);border-radius:16px;padding:8px 12px;display:flex;align-items:center;gap:10px}
.goal .lv{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--d);font-style:italic;font-weight:900;font-size:20px;color:var(--navy);border:2px solid #fff;flex:0 0 auto}
.goal .gt{flex:1;min-width:0}
.goal .gt small{font-size:10px;font-weight:700;letter-spacing:1.4px;opacity:.75;text-transform:uppercase;display:block}
.goal .gt b{font-family:var(--d);font-style:italic;font-size:22px}
#tiers{display:flex;gap:3px;margin-top:4px}
#tiers i{flex:1;height:6px;border-radius:3px}
#tiers i.nx{outline:2px solid var(--yel)}
#swipe{position:fixed;inset:0;pointer-events:auto}
.gbot{position:fixed;left:max(16px,var(--sl));right:max(16px,var(--sr));bottom:calc(var(--sb) + 16px);display:flex;align-items:flex-end;gap:10px}
.rb{width:58px;height:58px;border-radius:16px;background:rgba(2,39,83,.78);border:2px solid rgba(255,255,255,.25);font-size:22px;font-weight:800;position:relative;display:flex;align-items:center;justify-content:center}
.rb em{position:absolute;top:-8px;right:-8px;background:var(--yel);color:var(--navy);font-style:normal;font-size:12px;font-weight:800;border-radius:999px;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--navy)}
.big{margin-left:auto;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe873,#ffd41f 55%,#e3a900);border:4px solid var(--navy);box-shadow:0 6px 0 var(--navy);color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--d);font-style:italic;font-weight:900;font-size:20px;line-height:.95;position:relative}
.big .ic{font-size:30px;font-style:normal}
.big em{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-style:normal;font-family:var(--b);font-size:13px;font-weight:800;border-radius:999px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.big.dim{filter:saturate(.3);opacity:.75}
/* sheets */
.sheet{background:var(--cream);color:var(--navy);display:flex;flex-direction:column;gap:12px}
.sheet h2{font-family:var(--d);font-style:italic;font-weight:900;font-size:40px;color:var(--red)}
.sheet .sub{font-size:13px;color:#56627a;margin-top:-8px}
.sheet .scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-bottom:8px}
.sheet .back{align-self:stretch}
#albumGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.al{background:#fff;border:2px solid var(--navy);border-radius:14px;padding:6px;text-align:center;min-width:0}
.al .ai{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.al .ai img{width:100%;height:100%;object-fit:contain}
.al .ai b{font-family:var(--d);font-style:italic;font-size:44px;color:rgba(255,255,255,.35)}
.al .an{font-weight:800;font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al .ar{font-size:10px;font-weight:700}
.al.lock{opacity:.8}
#shopGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sh{background:#fff;border:2px solid var(--navy);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:center}
.sw{height:70px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--d);font-style:italic;font-weight:900;font-size:30px}
.sw.u{background:#ffe9a8;color:var(--navy)}
.sn{font-weight:800;font-size:14px}
.tuyrow{display:flex;justify-content:space-between;align-items:center}
.tuyrow .tuy{background:var(--navy);color:#fff}
/* modal */
#modal{position:fixed;inset:0;background:rgba(2,20,50,.62);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
#modal .card{background:var(--cream);color:var(--navy);border:4px solid var(--navy);border-radius:24px;padding:20px 18px;width:min(100%,340px);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:0 10px 0 var(--navy)}
#modal.pop .card{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.rv-k{font-family:var(--d);font-style:italic;font-weight:900;font-size:30px;color:var(--red)}
.rv-img{width:190px;height:190px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.rv-img img{width:100%;height:100%;object-fit:contain;animation:bob 2.4s ease-in-out infinite}
.rv-r{color:#fff;font-weight:800;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;border-radius:999px;padding:4px 10px}
.rv-n{font-family:var(--d);font-style:italic;font-weight:900;font-size:30px}
.rv-s{font-size:13px;color:#56627a}
.rv-b{background:#ffe9a8;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px}
.ov-s{font-family:var(--d);font-style:italic;font-weight:900;font-size:64px;line-height:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.row2 .btn{font-size:18px;padding:12px 8px}
#modal .card>.btn{width:100%}
#modal .btn.t{color:var(--navy);border-color:rgba(2,39,83,.3)}
.boxa{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center}
.boxa .bx{font-size:96px;animation:shake .5s ease-in-out 2}
.boxa .bi{position:absolute;font-size:54px;font-weight:900;color:var(--navy);animation:rise .6s .9s both cubic-bezier(.2,1.6,.4,1)}
@keyframes shake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes rise{from{transform:translateY(40px) scale(.2);opacity:0}to{transform:translateY(-58px) scale(1);opacity:1}}
#toast{position:fixed;left:50%;top:calc(var(--st) + 150px);transform:translateX(-50%);background:var(--navy);color:#fff;font-weight:700;font-size:14px;padding:10px 14px;border-radius:12px;z-index:30;max-width:86vw;text-align:center;border:2px solid var(--yel)}
#boot{position:fixed;inset:0;background:var(--red);display:flex;align-items:center;justify-content:center;z-index:50;font-family:var(--d);font-style:italic;font-weight:900;font-size:40px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

function Grid(size, previousState) {
  this.size = size;
  this.cells = previousState ? this.fromState(previousState) : this.empty();

// Build a grid of the specified size
Grid.prototype.empty = function () {
  var cells = [];

  for (var x = 0; x < this.size; x++) {
    var row = cells[x] = [];

    for (var y = 0; y < this.size; y++) {
      row.push(null);
    }
  }

  return cells;
};

Grid.prototype.fromState = function (state) {
  var cells = [];

  for (var x = 0; x < this.size; x++) {
    var row = cells[x] = [];

    for (var y = 0; y < this.size; y++) {
      var tile = state[x][y];
      row.push(tile ? new Tile(tile.position, tile.value) : null);
    }
  }

  return cells;
};

// Find the first available random position
Grid.prototype.randomAvailableCell = function () {
  var cells = this.availableCells();

  if (cells.length) {
    return cells[Math.floor(Math.random() * cells.length)];
  }
};

Grid.prototype.availableCells = function () {
  var cells = [];

  this.eachCell(function (x, y, tile) {
    if (!tile) {
      cells.push({ x: x, y: y });
    }
  });

  return cells;
};

  for (var x = 0; x < this.size; x++) {
    for (var y = 0; y < this.size; y++) {

    }
  }

  return !!this.availableCells().length;

  return !this.cellOccupied(cell);
};

Grid.prototype.cellOccupied = function (cell) {
  return !!this.cellContent(cell);
};

Grid.prototype.cellContent = function (cell) {
  if (this.withinBounds(cell)) {
    return this.cells[cell.x][cell.y];
  } else {
    return null;
  }
};

Grid.prototype.insertTile = function (tile) {
  this.cells[tile.x][tile.y] = tile;
};

Grid.prototype.removeTile = function (tile) {
  this.cells[tile.x][tile.y] = null;
};

Tile.prototype.updatePosition = function (position) {
  this.x = position.x;
  this.y = position.y;
};

  this.inputManager.on("restart", this.restart.bind(this));

    this.over        = previousState.over;
    this.won         = previousState.won;

  } else {

    over:       this.over,
    won:        this.won,
    bestScore:  this.storageManager.getBestScore(),

// Represent the current game as an object
GameManager.prototype.serialize = function () {

    score:       this.score,
    over:        this.over,
    won:         this.won,
    keepPlaying: this.keepPlaying

// Save all tile positions and remove merger info
GameManager.prototype.prepareTiles = function () {
  this.grid.eachCell(function (x, y, tile) {

      tile.savePosition();

// Move a tile and its representation
GameManager.prototype.moveTile = function (tile, cell) {
  this.grid.cells[tile.x][tile.y] = null;
  this.grid.cells[cell.x][cell.y] = tile;
  tile.updatePosition(cell);
};

// Move tiles on the grid in the specified direction
GameManager.prototype.move = function (direction) {
  // 0: up, 1: right, 2: down, 3: left
  var self = this;

  if (this.isGameTerminated()) return; // Don't do anything if the game's over

  var cell, tile;

  var vector     = this.getVector(direction);
  var traversals = this.buildTraversals(vector);
  var moved      = false;

  var before = this.serialize();
  // Save the current tile positions and remove merger information
  this.prepareTiles();

  // Traverse the grid in the right direction and move tiles
  traversals.x.forEach(function (x) {
    traversals.y.forEach(function (y) {
      cell = { x: x, y: y };
      tile = self.grid.cellContent(cell);

      if (tile) {
        var positions = self.findFarthestPosition(cell, vector);
        var next      = self.grid.cellContent(positions.next);

        if (next && next.value === tile.value && !next.mergedFrom) {
          var merged = new Tile(positions.next, tile.value * 2);
          merged.mergedFrom = [tile, next];

          self.grid.insertTile(merged);
          self.grid.removeTile(tile);

          // Converge the two tiles' positions
          tile.updatePosition(positions.next);

          // Update the score
          self.score += merged.value;

          // The mighty 2048 tile
          if (merged.value === 2048) self.won = true;
        } else {
          self.moveTile(tile, positions.farthest);
        }

        if (!self.positionsEqual(cell, tile)) {
          moved = true; // The tile moved from its original cell!
        }
      }
    });
  });

  if (moved) {
    this.prev = before;
    this.addRandomTile();

    if (!this.movesAvailable()) {
      this.over = true; // Game over!
    }

    this.actuate();
  }

// Get the vector representing the chosen direction
GameManager.prototype.getVector = function (direction) {
  // Vectors representing tile movement
  var map = {
    0: { x: 0,  y: -1 }, // Up
    1: { x: 1,  y: 0 },  // Right
    2: { x: 0,  y: 1 },  // Down
    3: { x: -1, y: 0 }   // Left
  };

  return map[direction];
};

// Build a list of positions to traverse in the right order
GameManager.prototype.buildTraversals = function (vector) {
  var traversals = { x: [], y: [] };

  for (var pos = 0; pos < this.size; pos++) {
    traversals.x.push(pos);
    traversals.y.push(pos);
  }

  // Always traverse from the farthest cell in the chosen direction
  if (vector.x === 1) traversals.x = traversals.x.reverse();
  if (vector.y === 1) traversals.y = traversals.y.reverse();

  return traversals;
};

GameManager.prototype.findFarthestPosition = function (cell, vector) {
  var previous;

  // Progress towards the vector direction until an obstacle is found
  do {
    previous = cell;
    cell     = { x: previous.x + vector.x, y: previous.y + vector.y };
  } while (this.grid.withinBounds(cell) &&
           this.grid.cellAvailable(cell));

  return {
    farthest: previous,
    next: cell // Used to check if a merge is required
  };
};

GameManager.prototype.movesAvailable = function () {
  return this.grid.cellsAvailable() || this.tileMatchesAvailable();
};

// Check for available matches between tiles (more expensive check)
GameManager.prototype.tileMatchesAvailable = function () {
  var self = this;

  var tile;

  for (var x = 0; x < this.size; x++) {
    for (var y = 0; y < this.size; y++) {
      tile = this.grid.cellContent({ x: x, y: y });

      if (tile) {

          var vector = self.getVector(direction);
          var cell   = { x: x + vector.x, y: y + vector.y };

          var other  = self.grid.cellContent(cell);

          if (other && other.value === tile.value) {
            return true; // These two tiles can be merged
          }
        }
      }
    }
  }

  return false;
};

GameManager.prototype.positionsEqual = function (first, second) {
  return first.x === second.x && first.y === second.y;
};

const swipeEl = $('#swipe');
swipeEl.addEventListener('pointerdown', (e) => { tStart = { x: e.clientX, y: e.clientY }; });
swipeEl.addEventListener('pointerup', (e) => { if (!tStart) return; const dx = e.clientX - tStart.x, dy = e.clientY - tStart.y; tStart = null; if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return; tryMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0)); });
swipeEl.addEventListener('pointercancel', () => (tStart = null));
document.addEventListener('touchmove', (e) => { if (inGame) e.preventDefault(); }, { passive: false });

// ---------- game state hooks ----------
let gm = null, roundMax = -1, celebrated = false;
function onState(grid, meta, bestMerge) {
  let mx = -1; grid.cells.forEach((c) => c.forEach((t) => { if (t) mx = Math.max(mx, tierOf(t.value)); }));
  $('#score').textContent = meta.score.toLocaleString('tr-TR'); $('#best').textContent = Math.max(meta.bestScore, meta.score).toLocaleString('tr-TR');
  updGoal(mx);
  if (mx > roundMax) {
    roundMax = mx;
    if (!SV.seen.includes(mx)) { SV.seen.push(mx); if (mx >= 2 && inGame) { SV.boxes += 1; setTimeout(() => reveal(mx), 380); } }
    SV.maxTier = Math.max(SV.maxTier, mx);
  }
  if (inGame && meta.won && meta.terminated && !meta.over && !celebrated) { celebrated = true; setTimeout(() => winPanel(), 600); }
  if (inGame && meta.over) setTimeout(() => overPanel(meta.score), 500);
  updBtns(); save();
}
function updGoal(mx) {
  const next = Math.min(TIERS.length - 1, mx + 1);
  $('#goalName').textContent = T(TIERS[next].tr, TIERS[next].en);
  $('#goalLv').textContent = next + 1;
  $('#goalLv').style.background = RCOL[TIERS[next].r];
  const box = $('#tiers'); box.innerHTML = '';
  for (let i = 0; i < TIERS.length; i++) { const d = document.createElement('i'); d.style.background = i <= mx ? TIERS[i].plate : 'rgba(255,255,255,.15)'; if (i === next) d.className = 'nx'; box.appendChild(d); }
}
function updBtns() {
  $('#undoN').textContent = SV.undo; $('#boxN').textContent = SV.boxes; $('#boxBtn').classList.toggle('dim', !SV.boxes);
  $('#tuyH').textContent = $('#tuyS').textContent = SV.tuy.toLocaleString('tr-TR'); $('#tuyG').textContent = SV.tuy.toLocaleString('tr-TR');
}

// ---------- thumbnails (album / reveal) ----------
let thumbR = null; const THUMB = {};
function thumb(t) {
  if (THUMB[t]) return THUMB[t];
  if (!thumbR) { thumbR = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); thumbR.setSize(256, 256); thumbR.toneMapping = THREE.ACESFilmicToneMapping; thumbR.toneMappingExposure = 0.95; }
  const s = new THREE.Scene(); s.environment = scene.environment; s.environmentIntensity = 0.6;
  s.add(new THREE.HemisphereLight(0xffffff, 0x445577, 0.9)); const d = new THREE.DirectionalLight(0xffffff, 2.4); d.position.set(3, 6, 5); s.add(d);
  const toy = makeToy({ colors: TIERS[t].f, base: TIERS[t].base, len: 2.2, lite: true }); toy.rotation.y = 0.5; toy.rotation.z = -0.15; s.add(toy);
  const c = new THREE.PerspectiveCamera(30, 1, 0.1, 50); c.position.set(0, 1.3, 7); c.lookAt(0, 1.15, 0);
  thumbR.setClearColor(0, 0); thumbR.render(s, c);
  return (THUMB[t] = thumbR.domElement.toDataURL('image/png'));
}

// ---------- panels ----------
function show(id) { document.querySelectorAll('.pane').forEach((p) => (p.hidden = p.id !== id)); }
function modal(html, cls = '') { busyModal = true; const m = $('#modal'); m.className = cls; m.querySelector('.card').innerHTML = html; m.hidden = false; return m; }
function closeModal() { $('#modal').hidden = true; busyModal = false; }

function reveal(t) {
  sfx.big();
  const d = TIERS[t];
  modal(`<div class="rv-k">${T('YENİ FLIX AÇILDI!', 'NEW FLIX UNLOCKED!')}</div>
    <div class="rv-img" style="background:radial-gradient(circle, ${d.plate} 0%, transparent 70%)"><img src="${thumb(t)}" alt=""></div>
    <div class="rv-r" style="background:${RCOL[d.r]}">${T(d.r, d.re)}</div>
    <div class="rv-n">${T(d.tr, d.en)}</div>
    <div class="rv-s">${T('Seviye', 'Level')} ${t + 1} · ${T('Albüme eklendi', 'Added to album')}</div>
    <div class="rv-b">🎁 +1 ${T('sürpriz kutu', 'surprise box')}</div>
    <button class="btn y" id="rvOk">${T('DEVAM', 'CONTINUE')}</button>`, 'pop');
  $('#rvOk').onclick = () => { closeModal(); updBtns(); };
}
function winPanel() {
  sfx.big();
  modal(`<div class="rv-k">${T('EFSANE!', 'LEGENDARY!')}</div><div class="rv-img"><img src="${thumb(10)}" alt=""></div>
  <div class="rv-n">${T('Altın FLIX\'e ulaştın', 'You reached the Golden FLIX')}</div><div class="rv-s">${T('Devam et, Ejder ve Gökkuşağı FLIX seni bekliyor.', 'Keep going, Dragon and Rainbow FLIX await.')}</div>
  <button class="btn y" id="wOk">${T('DEVAM ET', 'KEEP GOING')}</button>`, 'pop');
  $('#wOk').onclick = () => { closeModal(); gm.keepGoing(); };
}
function overPanel(score) {
  const earned = SV.paid ? 0 : Math.max(10, Math.floor(score / 12));
  if (!SV.paid) { SV.tuy += earned; SV.games += 1; SV.paid = 1; } save(); updBtns();
  modal(`<div class="rv-k">${T('HAMLE KALMADI', 'NO MOVES LEFT')}</div>
  <div class="ov-s">${score.toLocaleString('tr-TR')}</div><div class="rv-s">${T('Skor', 'Score')} · ${T('En iyi', 'Best')} ${SV.best.toLocaleString('tr-TR')}</div>
  ${earned ? `<div class="rv-b">🪶 +${earned} ${T('tüy kazandın', 'feathers earned')}</div>` : ''}
  <div class="row2"><button class="btn w" id="oUndo" ${SV.undo ? '' : 'disabled'}>↶ ${T('Geri al', 'Undo')} (${SV.undo})</button><button class="btn y" id="oNew">${T('YENİ OYUN', 'NEW GAME')}</button></div>
  <button class="btn t" id="oHome">${T('Ana menü', 'Main menu')}</button>`, 'pop');
  $('#oUndo').onclick = () => { if (doUndo()) closeModal(); };
  $('#oNew').onclick = () => { closeModal(); newGame(); };
  $('#oHome').onclick = () => { closeModal(); home(); };
}
function doUndo() {
  if (!SV.undo) { toast(T('Geri alma hakkın bitti. Dükkândan al.', 'No undos left. Get more in the shop.')); sfx.no(); return false; }
  if (!gm.undo()) { toast(T('Geri alınacak hamle yok', 'Nothing to undo')); return false; }
  SV.undo -= 1; save(); updBtns(); beep(440, 0.1, 'triangle', 0.1, 0.6); return true;
}
let toastT = 0;
function toast(s) { const t = $('#toast'); t.textContent = s; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 1800); }

const BOX_REWARDS = [
  () => { const n = [60, 80, 120, 150, 200, 300][Math.floor(Math.random() * 6)]; SV.tuy += n; return { i: '🪶', s: `+${n} ${T('tüy', 'feathers')}` }; },
  () => { SV.undo += 2; return { i: '↶', s: `+2 ${T('geri alma', 'undos')}` }; },
  () => { const n = 500; SV.tuy += n; return { i: '🪶', s: `+${n} ${T('tüy! Büyük ikramiye', 'feathers! Jackpot')}` }; },
];
function openBox() {
  if (!SV.boxes) { toast(T('Yeni bir FLIX aç, kutu kazan', 'Unlock a new FLIX to earn a box')); return; }
  SV.boxes -= 1; const r = Math.random(); const rew = (r < 0.62 ? BOX_REWARDS[0] : r < 0.93 ? BOX_REWARDS[1] : BOX_REWARDS[2])(); save(); updBtns(); sfx.box();
  modal(`<div class="rv-k">${T('SÜRPRİZ KUTU', 'SURPRISE BOX')}</div><div class="boxa"><div class="bx">🎁</div><div class="bi">${rew.i}</div></div><div class="rv-n">${rew.s}</div><button class="btn y" id="bOk">${T('SÜPER', 'NICE')}</button>`, 'pop box');
  $('#bOk').onclick = closeModal;
}

function album() {
  const cards = TIERS.map((d, i) => {
    const got = SV.seen.includes(i);
    return `<div class="al ${got ? '' : 'lock'}"><div class="ai" style="background:${got ? d.plate : '#0e2350'}">${got ? `<img src="${thumb(i)}" alt="">` : '<b>?</b>'}</div><div class="an">${got ? T(d.tr, d.en) : '???'}</div><div class="ar" style="color:${RCOL[d.r]}">${T('Sv', 'Lv')} ${i + 1} · ${T(d.r, d.re)}</div></div>`;
  }).join('');
  $('#albumGrid').innerHTML = cards; $('#albumCnt').textContent = `${SV.seen.length}/${TIERS.length}`;
  show('albumP');
}
function shop() {
  const th = THEMES.map((t) => {
    const own = SV.owned.includes(t.id), on = SV.theme === t.id;
    return `<div class="sh"><div class="sw" style="background:#${new THREE.Color(t.tray).getHexString()};box-shadow:inset 0 0 0 6px #${new THREE.Color(t.bg).getHexString()}"></div><div class="sn">${T(t.tr, t.en)}</div><button class="btn ${on ? 't' : own ? 'w' : 'y'} sm" data-th="${t.id}">${on ? T('Seçili', 'Selected') : own ? T('Seç', 'Use') : '🪶 ' + t.cost.toLocaleString('tr-TR')}</button></div>`;
  }).join('');
  $('#shopGrid').innerHTML = th + `<div class="sh"><div class="sw u">↶×5</div><div class="sn">${T('5 geri alma', '5 undos')}</div><button class="btn y sm" data-undo="1">🪶 300</button></div>`;
  $('#shopGrid').querySelectorAll('[data-th]').forEach((b) => (b.onclick = () => {
    const t = THEMES.find((x) => x.id === b.dataset.th);
    if (SV.owned.includes(t.id)) { SV.theme = t.id; } else if (SV.tuy >= t.cost) { SV.tuy -= t.cost; SV.owned.push(t.id); SV.theme = t.id; sfx.box(); } else { toast(T('Yeterli tüy yok', 'Not enough feathers')); sfx.no(); return; }
    save(); applyTheme(); updBtns(); shop();
  }));
  $('#shopGrid').querySelector('[data-undo]').onclick = () => { if (SV.tuy < 300) { toast(T('Yeterli tüy yok', 'Not enough feathers')); sfx.no(); return; } SV.tuy -= 300; SV.undo += 5; save(); updBtns(); sfx.box(); toast(T('+5 geri alma', '+5 undos')); };
  show('shopP');
}

// ---------- flow ----------
let homeSpin = 0;
function home() {
  inGame = false; show('homeP'); updBtns();
  const t = Math.max(2, SV.maxTier);
  $('#homeToy').src = thumb(t);
  $('#homeBest').textContent = SV.best.toLocaleString('tr-TR');
  $('#contBtn').hidden = !SV.game;
  needRender = true;
}
function play(fresh) {
  show('gameP'); inGame = true; celebrated = false;
  if (!gm) { gm = new GameManager(4, Input, Actuator, Storage); if (fresh) { roundMax = -1; SV.paid = 0; SV.undo = Math.max(SV.undo, 2); fresh = false; } }
  if (fresh) { roundMax = -1; SV.paid = 0; SV.undo = Math.max(SV.undo, 2); gm.restart(); }
  else { roundMax = -1; gm.actuate(); }
  if (!SV.tut) { SV.tut = 1; save(); toast(T('Kaydır: aynı iki FLIX birleşir', 'Swipe: two equal FLIX merge')); }
}
function newGame() { play(true); }

// lang + sound
function applyLang() {
  document.querySelectorAll('[data-tr]').forEach((e) => (e.textContent = SV.lang === 'en' ? e.dataset.en : e.dataset.tr));
  $('#langBtn').textContent = SV.lang === 'en' ? 'EN' : 'TR'; $('#sndBtn').textContent = SV.snd ? '🔊' : '🔇';
  if (gm && lastMeta) updGoal(roundMax);
}

// buttons
$('#playBtn').onclick = () => { beep(523, 0.08, 'triangle', 0.1); SV.game ? confirmNew() : newGame(); };
$('#contBtn').onclick = () => { beep(523, 0.08, 'triangle', 0.1); play(false); };
function confirmNew() {
  modal(`<div class="rv-n">${T('Yarım kalan oyun silinsin mi?', 'Discard the unfinished game?')}</div><div class="row2"><button class="btn w" id="cN">${T('Vazgeç', 'Cancel')}</button><button class="btn y" id="cY">${T('YENİ OYUN', 'NEW GAME')}</button></div>`, 'pop');
  $('#cN').onclick = closeModal; $('#cY').onclick = () => { closeModal(); newGame(); };
}
$('#albumBtn').onclick = album; $('#shopBtn').onclick = shop;
document.querySelectorAll('.back').forEach((b) => (b.onclick = home));
$('#homeBtn').onclick = home;
$('#undoBtn').onclick = doUndo; $('#boxBtn').onclick = openBox; $('#boxHome').onclick = openBox;
$('#newBtn').onclick = confirmNew;
$('#langBtn').onclick = () => { SV.lang = SV.lang === 'en' ? 'tr' : 'en'; save(); applyLang(); };
$('#sndBtn').onclick = () => { SV.snd = SV.snd ? 0 : 1; save(); applyLang(); };
document.addEventListener('visibilitychange', () => { if (document.hidden && AC) AC.suspend && AC.suspend(); else if (AC) AC.resume && AC.resume(); });

// ---------- loop ----------
let last = performance.now();
function frame() {
  requestAnimationFrame(frame);
  const nowMs = performance.now(), now = nowMs / 1000, dt = Math.min(0.05, (nowMs - last) / 1000); last = nowMs;
  let active = needRender; needRender = false;
  for (const a of anims) {
    const k = Math.min(1, Math.max(0, (now - a.t0) / a.dur)); if (k < 1) active = true;
    if (a.kind === 'slide' || a.kind === 'slideOut') { const e = 1 - Math.pow(1 - k, 3); a.o.position.lerpVectors(a.from, a.to, e); if (a.kind === 'slideOut' && k >= 1) a.o.visible = false; }
    else if (a.kind === 'pop') { const s = k <= 0 ? 0.001 : k < 0.6 ? (k / 0.6) * 1.22 : 1.22 - ((k - 0.6) / 0.4) * 0.22; a.o.scale.setScalar(Math.max(0.001, s)); }
    else if (a.kind === 'spawn') { const s = k <= 0 ? 0.001 : 1 - Math.pow(1 - k, 2); a.o.scale.setScalar(Math.max(0.001, s)); }
  }
  for (let i = fxPool.length - 1; i >= 0; i--) {
    const p = fxPool[i], k = (now - p.t0) / p.life;
    if (k < 0) { active = true; continue; }
    p.m.visible = true; active = true;
    if (k >= 1) { scene.remove(p.m); p.m.material.dispose(); fxPool.splice(i, 1); continue; }
    p.v.y -= 9 * dt; p.m.position.addScaledVector(p.v, dt); p.m.material.opacity = 1 - k;
  }
  if (glowRing.visible) { glowRing.material.color.offsetHSL(dt * 0.1, 0, 0); active = true; }
  if (active) renderer.render(scene, camera);
}

// ---------- boot ----------
resize(); applyTheme(); applyLang();
const logoImg = new Image(); logoImg.src = LOGO_URL;
logoImg.decode().catch(() => {}).then(() => {
  setLogo(logoImg);
  home();
  // pre-build first templates while on home
  [0, 1, 2, 3].forEach(tierTemplate);
  if (SV.game) { gm = new GameManager(4, Input, Actuator, Storage); inGame = false; }
  frame();
  $('#boot').remove();
  window.__fb = { get gm() { return gm; }, SV, move: (d) => Input.emit('move', d), TIERS, render: () => { needRender = true; } };
});

</script>
