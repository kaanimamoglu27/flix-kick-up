<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#e22511">
<title>Flix Kart</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Rubik:wght@400;500;700;800&display=swap">
<style>

:root{--red:#e22511;--navy:#022753;--yel:#ffd41f;--cream:#fff7e6;--d:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;--b:Rubik,system-ui,-apple-system,sans-serif;
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#15306b;font-family:var(--b);color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
#gl{position:fixed;inset:0;display:block}
.d{font-family:var(--d);font-style:italic;font-weight:900;line-height:.9}
.pane{position:fixed;inset:0;padding:calc(var(--st) + 12px) max(16px,var(--sr)) calc(var(--sb) + 16px) max(16px,var(--sl))}
.pane[hidden],[hidden]{display:none!important}
button{font-family:inherit;border:0;cursor:pointer;color:inherit}
.btn{border-radius:16px;padding:14px 18px;font-family:var(--d);font-style:italic;font-weight:900;font-size:24px;letter-spacing:.3px;border:3px solid var(--navy);box-shadow:0 5px 0 var(--navy);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--navy)}
.btn.y{background:var(--yel);color:var(--navy)} .btn.w{background:#fff;color:var(--navy)} .btn.t{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);box-shadow:none;font-size:18px}
.btn.sm{font-size:16px;padding:8px 10px;border-radius:12px;box-shadow:0 3px 0 var(--navy)}
.btn[disabled]{opacity:.45}
.chip{background:rgba(2,39,83,.72);border:2px solid rgba(255,255,255,.2);border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;min-width:70px}
.chip small{font-size:10px;font-weight:700;letter-spacing:1.4px;opacity:.75;text-transform:uppercase}
.chip b{font-family:var(--d);font-style:italic;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}

/* home */
#homeP{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;pointer-events:none;background:linear-gradient(180deg,rgba(226,37,17,.95) 0%,rgba(226,37,17,.75) 26%,rgba(226,37,17,0) 46%,rgba(226,37,17,0) 62%,rgba(2,39,83,.85) 100%)}
#homeP>*{pointer-events:auto}
.top{width:100%;display:flex;justify-content:space-between;align-items:center}
.top img{height:34px}
.mini{display:flex;gap:8px;align-items:center}
.mini button{background:rgba(2,39,83,.35);border-radius:12px;width:44px;height:36px;font-weight:800}
.tuy{background:rgba(2,39,83,.45);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px}
.hero-t{font-size:clamp(60px,18vw,92px);color:#fff;text-shadow:0 5px 0 var(--navy)}
.hero-t span{color:var(--yel)}
.hero-s{font-weight:500;font-size:14px;max-width:30ch}
.sp{flex:1;pointer-events:none!important}
.hb{display:grid;gap:12px;width:min(100%,360px)}
.hb .btn{width:100%}
/* sheets */
.sheet{background:var(--cream);color:var(--navy);display:flex;flex-direction:column;gap:12px}
.sheet h2{font-family:var(--d);font-style:italic;font-weight:900;font-size:40px;color:var(--red)}
.sheet .scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.trk{width:100%;text-align:left;border:3px solid var(--navy);border-radius:18px;padding:18px 16px;margin-bottom:12px;color:var(--navy);display:flex;flex-direction:column;gap:4px;position:relative;box-shadow:0 5px 0 var(--navy)}
.trk b{font-size:34px}
.trk span{font-weight:700;font-size:13px}
.trk em{position:absolute;right:14px;top:14px;font-style:normal;font-weight:800;background:#fff;border-radius:999px;padding:4px 10px}
.trk.lock{filter:grayscale(.8);opacity:.7}
#garageP{background:linear-gradient(180deg,rgba(255,247,230,0) 0%,rgba(255,247,230,0) 34%,var(--cream) 46%)}
#garageP .gh{display:flex;justify-content:space-between;align-items:center}
#garageP h3{font-weight:800;font-size:13px;letter-spacing:1.4px;text-transform:uppercase;margin:6px 0}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gi{background:#fff;border:2px solid var(--navy);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:5px;align-items:stretch;color:var(--navy);text-align:center}
.gi i{height:28px;border-radius:8px;display:block}
.gi span{font-weight:800;font-size:13px}
.gi em{font-style:normal;font-weight:800;font-size:12px;background:#ffe9a8;border-radius:8px;padding:3px}
.gi.on{outline:4px solid var(--yel)}
/* race hud */
#raceP{pointer-events:none}
#raceP .hud{pointer-events:auto}
.rtop{display:flex;align-items:flex-start;gap:8px}
.posb{display:flex;align-items:flex-end;gap:2px;text-shadow:0 3px 0 rgba(2,39,83,.7)}
.posb b{font-family:var(--d);font-style:italic;font-weight:900;font-size:76px;line-height:.8;color:var(--yel)}
.posb small{font-family:var(--d);font-style:italic;font-weight:900;font-size:26px}
.chip{background:rgba(2,39,83,.72);border:2px solid rgba(255,255,255,.2);border-radius:14px;padding:6px 10px;display:inline-flex;gap:8px;align-items:baseline;font-weight:700;font-size:13px;margin-top:8px}
.chip b{font-family:var(--d);font-style:italic;font-size:22px}
#mm{width:110px;height:110px;margin-left:auto;background:rgba(2,39,83,.35);border-radius:22px;border:2px solid rgba(255,255,255,.25)}
#pauseBtn{width:44px;height:44px;border-radius:14px;background:rgba(2,39,83,.72);border:2px solid rgba(255,255,255,.25);font-weight:900;font-size:18px}
.rbot{position:fixed;left:max(14px,var(--sl));right:max(14px,var(--sr));bottom:calc(var(--sb) + 14px);display:flex;align-items:flex-end;gap:10px}
.sb{width:76px;height:76px;border-radius:50%;background:rgba(2,39,83,.72);border:3px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;touch-action:none}
.sb.on{background:var(--yel);color:var(--navy);border-color:var(--navy)}
.rr2{margin-left:auto;display:flex;align-items:flex-end;gap:10px}
#bD{width:70px;height:70px;border-radius:20px;font-family:var(--d);font-style:italic;font-size:18px}
#bT{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe873,#ffd41f 55%,#e3a900);border:4px solid var(--navy);box-shadow:0 6px 0 var(--navy);color:var(--navy);position:relative;overflow:hidden;font-family:var(--d);font-style:italic;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;touch-action:none;filter:saturate(.35);opacity:.8}
#bT.ready{filter:none;opacity:1}
#bT.on{transform:translateY(4px);box-shadow:0 2px 0 var(--navy)}
#turboFill{position:absolute;left:0;right:0;bottom:0;background:rgba(226,37,17,.35);height:0}
#bT span{position:relative}
.spd{position:fixed;right:max(16px,var(--sr));bottom:calc(var(--sb) + 124px);text-align:right;font-family:var(--d);font-style:italic;font-weight:900;font-size:30px;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.spd small{font-size:14px}
#big{position:fixed;left:0;right:0;top:34%;text-align:center;font-family:var(--d);font-style:italic;font-weight:900;font-size:64px;color:#fff;text-shadow:0 5px 0 var(--navy);pointer-events:none;animation:bigA 1.1s forwards}
#big.cnt{font-size:120px;color:var(--yel)} #big.go{color:var(--yel);font-size:84px} #big.win{color:var(--yel);font-size:80px} #big.hide{display:none}
@keyframes bigA{0%{transform:scale(.4);opacity:0}15%{transform:scale(1.15);opacity:1}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(2,20,50,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.ov .card{background:var(--cream);color:var(--navy);border:4px solid var(--navy);border-radius:24px;padding:18px;width:min(100%,360px);display:flex;flex-direction:column;gap:10px;text-align:center;box-shadow:0 10px 0 var(--navy);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.ov h2{font-family:var(--d);font-style:italic;font-weight:900;font-size:44px;color:var(--red)}
.rr{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;font-weight:700;font-variant-numeric:tabular-nums}
.rr.me{background:var(--yel)}
.rr b{width:22px;font-family:var(--d);font-style:italic;font-size:22px}
.rr i{width:16px;height:16px;border-radius:50%;border:2px solid var(--navy)}
.rr span{flex:1;text-align:left}
.rr em{font-style:normal;font-size:13px}
#resRew{background:#ffe9a8;border-radius:12px;padding:10px;font-weight:800;font-size:14px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .btn{font-size:20px;padding:12px 8px}
#toast{position:fixed;left:50%;top:calc(var(--st) + 160px);transform:translateX(-50%);background:var(--navy);color:#fff;font-weight:700;font-size:14px;padding:10px 14px;border-radius:12px;z-index:30;width:max-content;max-width:86vw;text-align:center;border:2px solid var(--yel)}
#boot{position:fixed;inset:0;background:var(--red);display:flex;align-items:center;justify-content:center;z-index:50;font-family:var(--d);font-style:italic;font-weight:900;font-size:40px}
</style></head><body>

<div id="boot">FLIX KART…</div>

function canvasTex(w, h, draw, srgb = true) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const c = cv.getContext('2d'); draw(c, w, h);
  const t = new THREE.CanvasTexture(cv); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const rnd = (() => { let s = 1234567; return (a = 0, b = 1) => { s = (s * 16807) % 2147483647; return a + (b - a) * (s / 2147483647); }; })();
function phys(color, o = {}) { return new THREE.MeshPhysicalMaterial({ color, roughness: 0.5, ...o }); }
function mesh(geo, mat, par, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; if (par) par.add(m); return m; }

function hexBump() {
  return canvasTex(512, 512, (c, w, h) => {
    c.fillStyle = '#fff'; c.fillRect(0, 0, w, h); const r = 16, dx = r * Math.sqrt(3), dy = r * 1.5;
    c.strokeStyle = '#000'; c.lineWidth = 4;
    for (let j = -1; j < h / dy + 1; j++) for (let i = -1; i < w / dx + 1; i++) {
      const x = i * dx + (j % 2 ? dx / 2 : 0), y = j * dy; c.beginPath();
      for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3; c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
      c.closePath(); c.stroke();
    }
  }, false);
}

const featherCache = {};
function featherTex(hex) {
  hex = typeof hex === 'number' ? hex : new THREE.Color(hex).getHex();
  if (featherCache[hex]) return featherCache[hex];
  const col = new THREE.Color(hex);
  const t = canvasTex(256, 1024, (c, w, h) => {
    const cx = w / 2, prof = (v) => { // v: 0 bottom .. 1 tip -> half width
      if (v < 0.08) return 0.1 + v * 3; return Math.pow(Math.sin(Math.PI * Math.min(1, (v - 0.02) / 1.0)), 0.75) * (0.93 - 0.15 * v);
    };
    const hsl = {}; col.getHSL(hsl);
    const shade = (l, s = 0) => `hsl(${hsl.h * 360 + s},${Math.min(100, hsl.s * 100 + 5)}%,${Math.max(5, Math.min(92, l))}%)`;
    // solid vane
    const vg = c.createLinearGradient(0, h, 0, 0); vg.addColorStop(0, shade(hsl.l * 100 - 14)); vg.addColorStop(0.6, shade(hsl.l * 100)); vg.addColorStop(1, shade(hsl.l * 100 + 10));
    c.fillStyle = vg; c.beginPath(); c.moveTo(cx, h);
    for (let v = 0; v <= 1.001; v += 0.01) c.lineTo(cx + prof(v) * (w / 2 - 8), h * (1 - v) - prof(v) * 40);
    for (let v = 1; v >= 0; v -= 0.01) c.lineTo(cx - prof(v) * (w / 2 - 8), h * (1 - v) - prof(v) * 40);
    c.fill();
    // barbs
    for (let i = 0; i < 2600; i++) {
      const v = rnd(0.03, 0.995), side = rnd() < 0.5 ? -1 : 1, hw = prof(v) * (w / 2 - 6);
      const y0 = h * (1 - v), len = hw * rnd(0.85, 1.05), ang = 0.55 + v * 0.25;
      const L = hsl.l * 100 + (v - 0.5) * 18 + rnd(-8, 8) - (side > 0 ? 4 : 0);
      c.strokeStyle = shade(L, rnd(-6, 6)); c.lineWidth = rnd(0.8, 1.8); c.globalAlpha = 0.55;
      c.beginPath(); c.moveTo(cx, y0);
      c.quadraticCurveTo(cx + side * len * 0.55, y0 - len * ang * 0.25, cx + side * len, y0 - len * ang * 0.7); c.stroke();
    }

    c.globalCompositeOperation = 'destination-out'; c.globalAlpha = 1;
    for (let i = 0; i < 7; i++) {
      const v = rnd(0.25, 0.9), side = rnd() < 0.5 ? -1 : 1, hw = prof(v) * (w / 2), y0 = h * (1 - v);
      c.lineWidth = rnd(2, 4); c.beginPath(); c.moveTo(cx + side * hw * rnd(0.35, 0.6), y0 - hw * 0.3); c.lineTo(cx + side * hw * 1.1, y0 - hw * 0.95); c.stroke();
    }
    c.globalCompositeOperation = 'source-over';
    // fluffy down near base
    for (let i = 0; i < 260; i++) {
      const v = rnd(0, 0.16), side = rnd(-1, 1), y0 = h * (1 - v);
      c.strokeStyle = `rgba(255,255,255,${rnd(0.15, 0.4)})`; c.lineWidth = 1; c.beginPath(); c.moveTo(cx, y0);
      c.lineTo(cx + side * rnd(20, 70), y0 - rnd(10, 60)); c.stroke();
    }
    // rachis
    const g = c.createLinearGradient(0, h, 0, 0); g.addColorStop(0, '#fffaf0'); g.addColorStop(1, 'rgba(255,250,240,.6)');
    c.fillStyle = g; c.beginPath(); c.moveTo(cx - 5, h); c.lineTo(cx - 1, h * 0.01); c.lineTo(cx + 1, h * 0.01); c.lineTo(cx + 5, h); c.fill();

function featherGeo(L, Wd, bend, curl, lite) {

const KCFG = { accel: 22, drag: 0.42, brake: 40, maxSpeed: 36, turn: 2.15, grip: 7.5, driftGrip: 1.6, boostMul: 1.38, radius: 1.55, halfW: 1.2 };

function buildTrack(def) {
  const pts = def.pts.map(([x, z]) => new THREE.Vector3(x, 0, z));
  const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);
  const N = Math.round(curve.getLength() / 1.2);
  const P = [], Tn = [], Nm = [];
  for (let i = 0; i < N; i++) { const u = i / N; const p = curve.getPointAt(u), t = curve.getTangentAt(u); P.push(p); Tn.push(t); Nm.push(new THREE.Vector3(t.z, 0, -t.x)); }
  const K = P.map((_, i) => { const a = Tn[i], b = Tn[(i + 10) % N]; return Math.acos(Math.max(-1, Math.min(1, a.dot(b)))); });
  return { def, curve, N, P, Tn, Nm, K, W: def.width, len: curve.getLength() };
}

function nearest(tr, x, z, hint) {
  let best = -1, bd = 1e9; const N = tr.N;
  const scan = (from, to) => { for (let k = from; k <= to; k++) { const i = ((k % N) + N) % N; const p = tr.P[i]; const d = (p.x - x) ** 2 + (p.z - z) ** 2; if (d < bd) { bd = d; best = i; } } };
  if (hint >= 0) scan(hint - 20, hint + 30); if (hint < 0 || bd > tr.W * tr.W) scan(0, N - 1);

}
function results() {
  const def = race.def, place = race.place, rew = REWARD[place - 1] + (race.feathers || 0) * 2; const firstWin = place === 1 && !SV.wins[def.id];
  const bonus = firstWin ? 300 : 0; SV.tuy += rew + bonus; SV.races++; if (place === 1) SV.wins[def.id] = (SV.wins[def.id] || 0) + 1;
  const prevBest = SV.best[def.id]; const myT = me.finishT; const newBest = !prevBest || myT < prevBest; if (newBest) SV.best[def.id] = myT;
  let unlockMsg = '';
  if (place <= 3) { const nx = TRACKS[TRACKS.findIndex((t) => t.id === def.id) + 1]; if (nx && !SV.unlocked.includes(nx.id)) { SV.unlocked.push(nx.id); unlockMsg = `🔓 ${T('Yeni pist açıldı', 'New track unlocked')}: ${T(nx.tr, nx.en)}`; } }
  save();
  // estimate remaining finish times for bots still racing
  const rows = [...karts].map((k) => ({ k, t: k.done ? k.finishT : race.t + (def.laps - k.prog) * (world.tr.len / (KCFG.maxSpeed * 0.85)) })).sort((a, b) => a.t - b.t);
  $('#resList').innerHTML = rows.map((r, i) => `<div class="rr ${r.k.me ? 'me' : ''}"><b>${i + 1}</b><i style="background:#${new THREE.Color(r.k.color).getHexString()}"></i><span>${r.k.name}</span><em>${fmt(r.t)}</em></div>`).join('');
  $('#resTitle').textContent = place === 1 ? T('ŞAMPİYON!', 'CHAMPION!') : `${place}. ${T('SIRA', 'PLACE')}`;
  $('#resRew').innerHTML = `🪶 +${rew}${bonus ? ` · ${T('ilk galibiyet', 'first win')} +${bonus}` : ''}${newBest ? ` · ⏱ ${T('rekor', 'best')} ${fmt(myT)}` : ''}${unlockMsg ? `<br>${unlockMsg}` : ''}`;
  $('#res').hidden = false; engineOff();
}
function quitRace() { race = null; engineOff(); $('#res').hidden = true; $('#pause').hidden = true; big('', 'hide'); home(); }

// ---------- menus ----------
let showroom = { a: 0 };
function enterShowroom() {
  if (!world || world.def.id !== 'mutfak') buildWorld(TRACKS[0]);
  setupKarts(false); me.x = world.tr.P[40].x; me.z = world.tr.P[40].z; me.h = Math.atan2(-world.tr.Tn[40].x, -world.tr.Tn[40].z); syncKarts(0);
}
function home() { race = null; show('homeP'); enterShowroom(); upd(); }
function upd() { document.querySelectorAll('.tuyN').forEach((e) => (e.textContent = SV.tuy.toLocaleString('tr-TR'))); }
function tracksPane() {
  $('#trackList').innerHTML = TRACKS.map((t) => { const open = SV.unlocked.includes(t.id); return `<button class="trk ${open ? '' : 'lock'}" data-t="${t.id}" style="background:${t.id === 'mutfak' ? 'linear-gradient(135deg,#f6d7a8,#d9a46c)' : 'linear-gradient(135deg,#7fb0ff,#3c6fd1)'}">
    <b class="d">${T(t.tr, t.en)}</b><span>${t.laps} ${T('tur', 'laps')} · ${open ? (SV.best[t.id] ? '⏱ ' + fmt(SV.best[t.id]) : T('rekor yok', 'no record')) : '🔒 ' + T('önceki pistte ilk 3', 'top 3 on previous track')}</span>${SV.wins[t.id] ? `<em>🏆 ${SV.wins[t.id]}</em>` : ''}</button>`; }).join('');
  $('#trackList').querySelectorAll('.trk').forEach((b) => (b.onclick = () => { if (b.classList.contains('lock')) { toast(T('Önce önceki pistte ilk 3\'e gir', 'Finish top 3 on the previous track first')); return; } beep(523, 0.08, 'triangle', 0.1); startRace(b.dataset.t); }));
  show('trackP');
}
function garage() {
  const card = (it, own, on, kind) => `<button class="gi ${on ? 'on' : ''}" data-k="${kind}" data-id="${it.id}"><i style="background:${kind === 'c' ? '#' + new THREE.Color(it.c).getHexString() : `linear-gradient(90deg,${it.f.map((x) => '#' + new THREE.Color(x).getHexString()).join(',')})`}"></i><span>${T(it.tr, it.en)}</span><em>${on ? '✓' : own ? T('Seç', 'Use') : '🪶 ' + it.cost.toLocaleString('tr-TR')}</em></button>`;
  $('#gC').innerHTML = COLORS.map((c) => card(c, SV.ownC.includes(c.id), SV.color === c.id, 'c')).join('');
  $('#gF').innerHTML = FEATHERS.map((f) => card(f, SV.ownF.includes(f.id), SV.feather === f.id, 'f')).join('');
  document.querySelectorAll('.gi').forEach((b) => (b.onclick = () => {
    const kind = b.dataset.k, list = kind === 'c' ? COLORS : FEATHERS, own = kind === 'c' ? SV.ownC : SV.ownF, it = list.find((x) => x.id === b.dataset.id);
    if (!own.includes(it.id)) { if (SV.tuy < it.cost) { toast(T('Yeterli tüy yok. Yarışarak kazan!', 'Not enough feathers. Race to earn!')); beep(160, 0.18, 'sawtooth', 0.06, 0.7); return; } SV.tuy -= it.cost; own.push(it.id); sfx.buy(); }
    if (kind === 'c') SV.color = it.id; else SV.feather = it.id; save(); upd(); enterShowroom(); garage();
  }));
  show('garageP'); upd();
}
function applyLang() { document.querySelectorAll('[data-tr]').forEach((e) => (e.textContent = SV.lang === 'en' ? e.dataset.en : e.dataset.tr)); $('#langBtn').textContent = SV.lang === 'en' ? 'EN' : 'TR'; $('#sndBtn').textContent = SV.snd ? '🔊' : '🔇'; }
$('#playBtn').onclick = () => { ac(); beep(523, 0.08, 'triangle', 0.1); tracksPane(); };
$('#garBtn').onclick = () => { ac(); garage(); };
document.querySelectorAll('.back').forEach((b) => (b.onclick = home));
$('#langBtn').onclick = () => { SV.lang = SV.lang === 'en' ? 'tr' : 'en'; save(); applyLang(); };
$('#sndBtn').onclick = () => { SV.snd = SV.snd ? 0 : 1; save(); applyLang(); if (!SV.snd) engineOff(); };
$('#pauseBtn').onclick = () => { if (!race || race.shown) return; race.paused = true; $('#pause').hidden = false; engineOff(); };
$('#resume').onclick = () => { race.paused = false; $('#pause').hidden = true; engineOn(); };
$('#quit').onclick = quitRace; $('#resHome').onclick = quitRace;
$('#again').onclick = () => { $('#res').hidden = true; const id = race.def.id; startRace(id); };
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (race && !race.shown && !race.paused) { race.paused = true; $('#pause').hidden = false; } engineOff(); if (AC && AC.suspend) AC.suspend(); } else if (AC && AC.resume) AC.resume(); });

// ---------- camera ----------
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(); let camInit = false, sway = 0;
function updCamera(dt, t) {
  if (!me) return;
  if (!race) { // showroom orbit
    showroom.a += dt * 0.35; const r = 11; camera.position.set(me.x + Math.sin(showroom.a) * r, 4.2, me.z + Math.cos(showroom.a) * r); camera.lookAt(me.x, 2.2, me.z);
    camera.fov = W / H < 0.75 ? 52 : 45; camera.updateProjectionMatrix(); camInit = false; return;
  }
  const fx = fwdX(me), fz = fwdZ(me), sp = Math.max(0, me.s);
  const back = 12.5 + sp / 12, up = 6.2 + sp / 30;
  const tx = me.x - fx * back, tz = me.z - fz * back;
  if (!camInit) { camPos.set(tx, up, tz); camLook.set(me.x + fx * 12, 1.2, me.z + fz * 12); camInit = true; }
  camPos.lerp(new THREE.Vector3(tx, up, tz), Math.min(1, dt * 6)); camLook.lerp(new THREE.Vector3(me.x + fx * 12, 1.2, me.z + fz * 12), Math.min(1, dt * 8));
  camera.position.copy(camPos); camera.lookAt(camLook);
  // racing-game style sway when boosting + roll into turns
  const turbo = me.turbo; sway += ((turbo ? (sp / KCFG.maxSpeed + 0.25) * 30 : (sp / KCFG.maxSpeed) * 2) - sway) * Math.min(1, dt * 10);
  camera.rotation.z += (-me.steer * sp) / 900 + (Math.sin(t * (turbo ? 60 : 30) * 0.9) / 1000) * sway;
  const fov = (W / H < 0.75 ? 66 : 55) + (turbo ? 8 : 0) + sp / 12; camera.fov += (fov - camera.fov) * Math.min(1, dt * 4); camera.updateProjectionMatrix();
}

// ---------- loop ----------
let last = performance.now(), hudT = 0;
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000), t = now / 1000; last = now;
  if (race && !race.paused && !race.shown) { const n = Math.ceil(dt / (1 / 60)); for (let i = 0; i < n; i++) stepRace(dt / n); }
  syncKarts(dt); stepParts(dt);
  if (me) { sunL.position.set(me.x - 20, 40, me.z + 14); sunL.target.position.set(me.x, 0, me.z); }
  updCamera(dt, t);
  hudT += dt; if (race && hudT > 0.08) { hudT = 0; updHud(); drawMinimap(); }
  renderer.render(scene, camera);
}

// ---------- boot ----------
const LOGO_IMG = new Image(); LOGO_IMG.src = LOGO_URL;
LOGO_IMG.decode().catch(() => {}).then(() => {
  setLogo(LOGO_IMG); resize(); applyLang(); home(); frame(); $('#boot').remove();
  window.__fk = { snap: () => { camInit = false; }, auto: (sec, thr = 0.25) => { for (let i = 0; i < sec * 60 && race && !race.shown; i++) { const c = botControl(world.tr, me, race.t); ctl.left = c.steer > thr; ctl.right = c.steer < -thr; ctl.turbo = window.__noT ? false : me.boost > 40; if (!race.paused) stepRace(1 / 60); } ctl.left = ctl.right = ctl.turbo = false; syncKarts(1 / 60); }, sim: (sec) => { for (let i = 0; i < sec * 60; i++) if (race && !race.paused && !race.shown) stepRace(1 / 60); syncKarts(1 / 60); }, get race() { return race; }, get me() { return me; }, karts: () => karts, SV, startRace, ctl, home };
});

</script>
