<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#e22511">
<title>Flix Kart</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Rubik:wght@400;500;700;800&display=swap">
<style>

:root{--red:#e22511;--navy:#022753;--yel:#ffd41f;--cream:#fff7e6;--d:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;--b:Rubik,system-ui,-apple-system,sans-serif;
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#15306b;font-family:var(--b);color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
#gl{position:fixed;inset:0;display:block}
.d{font-family:var(--d);font-style:italic;font-weight:900;line-height:.9}
.pane{position:fixed;inset:0;padding:calc(var(--st) + 12px) max(16px,var(--sr)) calc(var(--sb) + 16px) max(16px,var(--sl))}
.pane[hidden],[hidden]{display:none!important}
button{font-family:inherit;border:0;cursor:pointer;color:inherit}
.btn{border-radius:16px;padding:14px 18px;font-family:var(--d);font-style:italic;font-weight:900;font-size:24px;letter-spacing:.3px;border:3px solid var(--navy);box-shadow:0 5px 0 var(--navy);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--navy)}
.btn.y{background:var(--yel);color:var(--navy)} .btn.w{background:#fff;color:var(--navy)} .btn.t{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);box-shadow:none;font-size:18px}
.btn.sm{font-size:16px;padding:8px 10px;border-radius:12px;box-shadow:0 3px 0 var(--navy)}
.btn[disabled]{opacity:.45}
.chip{background:rgba(2,39,83,.72);border:2px solid rgba(255,255,255,.2);border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;min-width:70px}
.chip small{font-size:10px;font-weight:700;letter-spacing:1.4px;opacity:.75;text-transform:uppercase}
.chip b{font-family:var(--d);font-style:italic;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}

/* home */
#homeP{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;pointer-events:none;background:linear-gradient(180deg,rgba(226,37,17,.95) 0%,rgba(226,37,17,.75) 26%,rgba(226,37,17,0) 46%,rgba(226,37,17,0) 62%,rgba(2,39,83,.85) 100%)}
#homeP>*{pointer-events:auto}
.top{width:100%;display:flex;justify-content:space-between;align-items:center}
.top img{height:34px}
.mini{display:flex;gap:8px;align-items:center}
.mini button{background:rgba(2,39,83,.35);border-radius:12px;width:44px;height:36px;font-weight:800}
.tuy{background:rgba(2,39,83,.45);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px}
.hero-t{font-size:clamp(60px,18vw,92px);color:#fff;text-shadow:0 5px 0 var(--navy)}
.hero-t span{color:var(--yel)}
.hero-s{font-weight:500;font-size:14px;max-width:30ch}
.sp{flex:1;pointer-events:none!important}
.hb{display:grid;gap:12px;width:min(100%,360px)}
.hb .btn{width:100%}
/* sheets */
.sheet{background:var(--cream);color:var(--navy);display:flex;flex-direction:column;gap:12px}
.sheet h2{font-family:var(--d);font-style:italic;font-weight:900;font-size:40px;color:var(--red)}
.sheet .scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.trk{width:100%;text-align:left;border:3px solid var(--navy);border-radius:18px;padding:18px 16px;margin-bottom:12px;color:var(--navy);display:flex;flex-direction:column;gap:4px;position:relative;box-shadow:0 5px 0 var(--navy)}
.trk b{font-size:34px}
.trk span{font-weight:700;font-size:13px}
.trk em{position:absolute;right:14px;top:14px;font-style:normal;font-weight:800;background:#fff;border-radius:999px;padding:4px 10px}
.trk.lock{filter:grayscale(.8);opacity:.7}
#garageP{background:linear-gradient(180deg,rgba(255,247,230,0) 0%,rgba(255,247,230,0) 34%,var(--cream) 46%)}
#garageP .gh{display:flex;justify-content:space-between;align-items:center}
.gi.drv i{display:flex;align-items:center;justify-content:center;font-size:20px}
#garageP h3{font-weight:800;font-size:13px;letter-spacing:1.4px;text-transform:uppercase;margin:6px 0}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gi{background:#fff;border:2px solid var(--navy);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:5px;align-items:stretch;color:var(--navy);text-align:center}
.gi i{height:28px;border-radius:8px;display:block}
.gi span{font-weight:800;font-size:13px}
.gi em{font-style:normal;font-weight:800;font-size:12px;background:#ffe9a8;border-radius:8px;padding:3px}
.gi.on{outline:4px solid var(--yel)}
/* race hud */
#raceP{pointer-events:none}
#raceP .hud{pointer-events:auto}
.rtop{display:flex;align-items:flex-start;gap:8px}
.posb{display:flex;align-items:flex-end;gap:2px;text-shadow:0 3px 0 rgba(2,39,83,.7)}
.posb b{font-family:var(--d);font-style:italic;font-weight:900;font-size:76px;line-height:.8;color:var(--yel)}
.posb small{font-family:var(--d);font-style:italic;font-weight:900;font-size:26px}
.chip{background:rgba(2,39,83,.72);border:2px solid rgba(255,255,255,.2);border-radius:14px;padding:6px 10px;display:inline-flex;gap:8px;align-items:baseline;font-weight:700;font-size:13px;margin-top:8px}
.chip b{font-family:var(--d);font-style:italic;font-size:22px}
#mm{width:110px;height:110px;margin-left:auto;background:rgba(2,39,83,.35);border-radius:22px;border:2px solid rgba(255,255,255,.25)}
#pauseBtn{width:44px;height:44px;border-radius:14px;background:rgba(2,39,83,.72);border:2px solid rgba(255,255,255,.25);font-weight:900;font-size:18px}
.rbot{position:fixed;left:max(14px,var(--sl));right:max(14px,var(--sr));bottom:calc(var(--sb) + 14px);display:flex;align-items:flex-end;gap:10px}
.sb{width:76px;height:76px;border-radius:50%;background:rgba(2,39,83,.72);border:3px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;touch-action:none}
.sb.on{background:var(--yel);color:var(--navy);border-color:var(--navy)}
.rr2{margin-left:auto;display:flex;align-items:flex-end;gap:10px}
#bD{width:70px;height:70px;border-radius:20px;font-family:var(--d);font-style:italic;font-size:18px}
#bT{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe873,#ffd41f 55%,#e3a900);border:4px solid var(--navy);box-shadow:0 6px 0 var(--navy);color:var(--navy);position:relative;overflow:hidden;font-family:var(--d);font-style:italic;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;touch-action:none;filter:saturate(.35);opacity:.8}
#bT.ready{filter:none;opacity:1}
#bT.on{transform:translateY(4px);box-shadow:0 2px 0 var(--navy)}
#turboFill{position:absolute;left:0;right:0;bottom:0;background:rgba(226,37,17,.35);height:0}
#bT span{position:relative}
.spd{position:fixed;right:max(16px,var(--sr));bottom:calc(var(--sb) + 124px);text-align:right;font-family:var(--d);font-style:italic;font-weight:900;font-size:30px;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.spd small{font-size:14px}
#big{position:fixed;left:0;right:0;top:34%;text-align:center;font-family:var(--d);font-style:italic;font-weight:900;font-size:64px;color:#fff;text-shadow:0 5px 0 var(--navy);pointer-events:none;animation:bigA 1.1s forwards}
#big.cnt{font-size:120px;color:var(--yel)} #big.go{color:var(--yel);font-size:84px} #big.win{color:var(--yel);font-size:80px} #big.hide{display:none}
@keyframes bigA{0%{transform:scale(.4);opacity:0}15%{transform:scale(1.15);opacity:1}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(2,20,50,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.ov .card{background:var(--cream);color:var(--navy);border:4px solid var(--navy);border-radius:24px;padding:18px;width:min(100%,360px);display:flex;flex-direction:column;gap:10px;text-align:center;box-shadow:0 10px 0 var(--navy);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.ov h2{font-family:var(--d);font-style:italic;font-weight:900;font-size:44px;color:var(--red)}
.rr{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;font-weight:700;font-variant-numeric:tabular-nums}
.rr.me{background:var(--yel)}
.rr b{width:22px;font-family:var(--d);font-style:italic;font-size:22px}
.rr i{width:16px;height:16px;border-radius:50%;border:2px solid var(--navy)}
.rr span{flex:1;text-align:left}
.rr em{font-style:normal;font-size:13px}
#resRew{background:#ffe9a8;border-radius:12px;padding:10px;font-weight:800;font-size:14px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .btn{font-size:20px;padding:12px 8px}
.sup2{position:fixed;right:max(14px,var(--sr));bottom:calc(var(--sb) + 124px);display:flex;gap:10px;align-items:flex-end}
#bI,#bS{width:74px;height:74px;border-radius:50%;background:rgba(2,39,83,.72);border:3px solid rgba(255,255,255,.35);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none}
#bI{width:84px;height:84px} #bI.ready{background:#fff;border-color:var(--yel);box-shadow:0 0 0 4px rgba(255,212,31,.5)} #itIc{font-size:40px;line-height:1} #itN{position:absolute;right:10px;bottom:6px;font-size:14px;color:var(--navy)}
#supFill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#ff2d9a,#ffd41f);opacity:.55;height:0}
#bS span{position:relative;font-size:26px;line-height:1} #bS small{position:relative;font-family:var(--d);font-style:italic;font-weight:900;font-size:13px}
#bS.ready{border-color:var(--yel);animation:pulse .6s infinite alternate} #bS.ready #supFill{opacity:.95}
@keyframes pulse{to{transform:scale(1.08);box-shadow:0 0 18px #ffd41f}}
.tt .sup2{display:none}
#goal{position:fixed;left:0;right:0;top:calc(var(--st) + 120px);text-align:center;font-size:30px;color:var(--yel);text-shadow:0 2px 0 var(--navy);display:none}
.tt #goal{display:block}
.spd{left:max(16px,var(--sl));right:auto!important;text-align:left!important}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;z-index:5}
#resStars{font-size:44px;letter-spacing:6px;color:#d8cdb5;margin-top:-6px}
#resStars i{font-style:normal;display:inline-block;animation:pop .4s backwards}
#resStars i.on{color:var(--yel);text-shadow:0 3px 0 var(--navy)}
#next{width:100%}
.world{border:3px solid var(--navy);border-radius:18px;padding:12px;margin-bottom:12px;box-shadow:0 5px 0 var(--navy);color:var(--navy)}
.world.lock{filter:grayscale(.8);opacity:.7}
.wh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.wh b{font-size:32px} .wh em{font-style:normal;font-weight:800;background:#fff;border-radius:999px;padding:4px 10px}
.evs{display:grid;gap:6px}
.ev{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.9);border:2px solid var(--navy);border-radius:12px;padding:8px 10px;color:var(--navy);text-align:left}
.ev .mi{font-size:24px} .ev .et{flex:1;display:flex;flex-direction:column} .ev b{font-size:15px} .ev small{font-size:12px;font-weight:500}
.ev .es{color:#e3a900;font-size:18px;letter-spacing:1px} .ev .es i{color:#cfc4ae;font-style:normal}
.gi.veh .bars{display:flex;flex-direction:column;gap:3px;text-align:left}
.gi.veh p{display:flex;flex-direction:column;font-size:10px;font-weight:700} .gi.veh u{display:block;height:6px;background:#eadfc8;border-radius:3px;text-decoration:none} .gi.veh s{display:block;height:100%;background:var(--red);border-radius:3px}
.upr{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--navy);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.upr b{width:86px;font-size:14px} .upr span{flex:1;display:flex;gap:4px} .upr i{flex:1;height:10px;border-radius:5px;background:#eadfc8} .upr i.on{background:var(--red)} .upr em{font-style:normal;font-weight:900}
.hb .row2 .btn{font-size:20px}
#toast{position:fixed;left:50%;top:calc(var(--st) + 160px);transform:translateX(-50%);background:var(--navy);color:#fff;font-weight:700;font-size:14px;padding:10px 14px;border-radius:12px;z-index:30;width:max-content;max-width:86vw;text-align:center;border:2px solid var(--yel)}
#boot{position:fixed;inset:0;background:var(--red);display:flex;align-items:center;justify-content:center;z-index:50;font-family:var(--d);font-style:italic;font-weight:900;font-size:40px}
</style></head><body>

// ============================================================
// Super Kart 3D.js — sfx.js
// Pure procedural SFX recipes (fat modern arcade racing theme), 100%
// synthesized with the WebAudio API — no samples, no assets.
//
// Palette (FECO r2 pass): every beep-type SFX was rebuilt from raw
// chiptune tones into layered, filtered, punchy hits — sub-kick thumps,
// noise bursts with filter sweeps, lowpassed square bodies, sparkle
// layers. The AudioManager master chain (EQ → saturation → glue
// compressor → makeup → limiter, with a shared convolver reverb send)
// seats them all in one fat arcade space.
//
// Contract (ARCHITECTURE.md):
//   renderSfx(ctx, out, name, opts)
//     ctx  — ANY BaseAudioContext (AudioContext in the game,
//            OfflineAudioContext for QA rendering).
//     out  — destination AudioNode (master chain or ctx.destination).
//     name — one of the SFX names below.
//     opts — { volume=1, rate=1, pan=0, at=0, ... } plus per-recipe
//            extras (speed01, dur).
//
// The recipes are pure: no DOM, no global state. The WAV dumped by
// scripts/render-sfx.mjs therefore IS the sound the game plays.
//
// Pitfalls baked in (validated in the match-3djs project):
//   - Long tails use setTargetAtTime(0.0001, t, timeConstant)
//     instead of exponentialRampToValueAtTime (decays too fast).
//   - Noise buffers are DC-blocked (mean subtracted) to avoid pops.
//   - Oscillator frequencies are clamped to >= 30 Hz.
// ============================================================

// Note frequencies (Hz). C4 = 261.63.
const N = {
  C4: 261.63, E4: 329.63, G4: 392.0, B4: 493.88,
  C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880.0,
  C6: 1046.5, D6: 1174.66, E6: 1318.51, G6: 1567.98, A6: 1760.0,
  C7: 2093.0, D7: 2349.32,

const SFX_PENTA = [N.C5, N.D5, N.E5, N.G5, N.A5, N.C6, N.D6, N.E6];

// Deterministic noise keeps OfflineAudioContext renders reproducible while
// preserving the same broadband texture in live playback. Audio variation is
// supplied by pitch/pan/event timing, never by an unseeded global RNG.
function mulberry32(seed) {
  return () => {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ------------------------------------------------------------
// Engine gear map (audit r2): a continuous 55→205Hz RPM sweep reads as
// a synth drone, not a kart. Piecewise gears with OVERLAPPING ranges
// (hysteresis): at the shift boundary the new gear always starts BELOW
// the old gear's redline, so the pitch audibly DROPS on upshift, then
// climbs again. `load` is the throttle proxy (speed01); `local` is the
// position inside the current gear (0 right after shift → 1 redline).
// Shared by the live engine loop (AudioManager) and the QA 'engine'
// recipe so both always agree.
// ------------------------------------------------------------
const ENGINE_GEARS = [
  { lo: 0.0,  hi: 0.28, base: 58,  redline: 150 },
  { lo: 0.22, hi: 0.52, base: 92,  redline: 175 },
  { lo: 0.48, hi: 0.78, base: 128, redline: 195 },
  { lo: 0.74, hi: 1.0,  base: 164, redline: 205 },
];

/**
 * Piecewise gear map: speed01 (0 idle … 1 full) → engine state.
 * @param {number} speed01
 * @returns {{gear:number, rpm:number, local:number, load:number, ratio:number}}
 */
function engineGear(speed01) {
  const s = clamp(speed01, 0, 1);
  let gear = 0;
  for (let g = 1; g < ENGINE_GEARS.length; g++) {
    if (s >= ENGINE_GEARS[g].lo) gear = g;
  }
  const gd = ENGINE_GEARS[gear];
  const span = Math.max(1e-6, gd.hi - gd.lo);
  const local = clamp((s - gd.lo) / span, 0, 1);
  const rpm = gd.base + local * (gd.redline - gd.base);
  const lo = ENGINE_GEARS[0].base;
  const hi = ENGINE_GEARS[ENGINE_GEARS.length - 1].redline;
  return {
    gear,
    rpm,
    local,
    load: s, // throttle proxy — 0 coasting, 1 full throttle
    ratio: clamp((rpm - lo) / (hi - lo), 0, 1),

// One cached 2s white-noise buffer per context (DC-blocked).
// BufferSources are stopped early, so a single buffer serves
// every requested duration.
const _noiseCache = new WeakMap();

  let buf = _noiseCache.get(ctx);

    const data = buf.getChannelData(0);

    const rng = mulberry32((ctx.sampleRate ^ len ^ 0x534658) | 0);
    for (let i = 0; i < len; i++) {
      data[i] = rng() * 2 - 1;
      sum += data[i];
    }
    const mean = sum / len;
    if (Math.abs(mean) > 1e-7) {
      for (let i = 0; i < len; i++) data[i] -= mean;

    _noiseCache.set(ctx, buf);

    }
    flt.Q.value = filterQ;
    oscNode.connect(flt);
    node = flt;
  }

  if (timeConstant != null) {
    env(gain, { at, peak: vol, attack, timeConstant });
  } else if (sustain) {
    env(gain, { at, peak: vol, attack, dur, sustain: true, release });
  } else {
    env(gain, { at, peak: vol, attack, dur });
  }

  node.connect(gain);
  gain.connect(out);
  const tail = timeConstant != null ? Math.min(0.6, timeConstant * 4) : 0.06;
  oscNode.start(at);
  oscNode.stop(at + dur + tail);
}

/**
 * Filtered noise burst. Same envelope modes as `osc`; `glideTo` sweeps
 * the filter cutoff (whooshes).
 */
function noise(ctx, out, {
  dur = 0.1, vol = 0.2, at = 0, filterType = 'lowpass', freq = 800, q = 1,
  glideTo = null, attack = 0.003, timeConstant = null, sustain = false, release = 0.05,
}) {
  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer(ctx);
  const flt = ctx.createBiquadFilter();
  flt.type = filterType;
  flt.frequency.setValueAtTime(Math.max(20, freq), at);
  if (glideTo !== null && glideTo > 0) {
    flt.frequency.exponentialRampToValueAtTime(Math.max(20, glideTo), at + Math.max(0.02, dur));
  }
  flt.Q.value = q;
  const gain = ctx.createGain();
  if (timeConstant != null) {
    env(gain, { at, peak: vol, attack, timeConstant });
  } else if (sustain) {
    env(gain, { at, peak: vol, attack, dur, sustain: true, release });
  } else {
    env(gain, { at, peak: vol, attack, dur });
  }
  src.connect(flt);
  flt.connect(gain);
  gain.connect(out);
  const tail = timeConstant != null ? Math.min(0.6, timeConstant * 4) : 0.06;
  src.start(at);
  src.stop(at + dur + tail);
}

/**
 * Punchy sub kick — the modern arcade impact body (no samples):
 * a sine thump with a fast exponential pitch drop + a 2ms highpassed
 * noise "beater" click for attack. Used to fatten hits, pickups and
 * boost launches instead of raw beeps.
 */
function kick(ctx, out, { at = 0, vol = 0.6, freq = 140, glideTo = 40, dur = 0.22, click = 0.35 }) {
  osc(ctx, out, {
    type: 'sine', freq: Math.max(30, freq), glideTo: Math.max(30, glideTo),
    dur, vol, at, attack: 0.001,
  });
  noise(ctx, out, { dur: 0.012, vol: vol * click, at, filterType: 'highpass', freq: 6000 });
}

/**
 * Bell chime: fundamental + harmonic partials + a detuned pair for
 * shimmer. Uses setTargetAtTime tails (long natural decay).
 */
function chime(ctx, out, { freq = 523, dur = 0.3, vol = 0.3, at = 0, partials = [1, 2, 3, 4], timeConstant = null }) {
  const tc = timeConstant ?? dur * 0.22;
  const amps = { 1: 1.0, 2: 0.42, 3: 0.2, 4: 0.1, 5: 0.06, 6: 0.04 };
  // AUDIT R60 (auditoria som #1/10): 'star' C7×6 = 12.5kHz, 'itemPickup'
  // ×5 = 10.4kHz — partials acima de 8kHz reforçavam o brilho estridente.
  // Filtra os que passam de 8kHz; nunca deixa vazio.
  const usable = partials.filter((p) => freq * p <= 8000);
  if (!usable.length) usable.push(1);
  const ampScale = usable.length > 3 ? 1.25 : 1;
  for (const p of usable) {
    osc(ctx, out, {
      type: 'sine', freq: Math.max(30, freq * p), dur, vol: vol * (amps[p] ?? 0.2) / ampScale,
      at, attack: 0.003, timeConstant: tc,
    });
  }
  osc(ctx, out, { type: 'sine', freq: Math.max(30, freq * 1.003), dur: dur * 0.85, vol: vol * 0.16, at, attack: 0.003, timeConstant: tc * 0.8 });
  osc(ctx, out, { type: 'sine', freq: Math.max(30, freq * 0.997), dur: dur * 0.85, vol: vol * 0.16, at, attack: 0.003, timeConstant: tc * 0.8 });
}

/** Bright cartoon "horn" voice: sawtooth + square through lowpasses. */
function horn(ctx, out, at, freq, dur, vol = 0.5) {
  osc(ctx, out, { type: 'sawtooth', freq, dur, vol: vol * 0.8, at, attack: 0.008, sustain: true, release: 0.07, filterType: 'lowpass', filterFreq: 2300, filterQ: 0.7 });
  osc(ctx, out, { type: 'square', freq, dur, vol: vol * 0.35, at, attack: 0.008, sustain: true, release: 0.07, filterType: 'lowpass', filterFreq: 3400, filterQ: 0.7 });
}

/* ---------------- Recipes ---------------- */

/**
 * Render one SFX into `out`.
 * @param {BaseAudioContext} ctx
 * @param {AudioNode} out
 * @param {string} name engine|boost|drift|itemPickup|useItem|shell|redShell|
 *   banana|star|lightning|crash|countdown|go|lap|finalLap|cheer|finish|
 *   victory|uiClick|uiHover|musicIntro (alias: menuMusic)
 * @param {Object} [opts] { volume=1, rate=1, pan=0, at=0, speed01, dur }
 */
function renderSfx(ctx, out, name, opts = {}) {
  if (!ctx || !out) return;
  const { volume = 1, rate = 1, pan = 0, at = 0 } = opts;
  const v = (x) => x * volume;

  // Optional stereo pan: route every voice through a panner.
  let target = out;
  if (typeof pan === 'number' && pan !== 0 && typeof ctx.createStereoPanner === 'function') {
    const panner = ctx.createStereoPanner();
    panner.pan.value = clamp(pan, -1, 1);
    panner.connect(out);
    target = panner;
  }

  switch (name) {
    case 'engine': {
      // Looping tone pair (sawtooth base + square octave + sine sub) used
      // by AudioManager.setEngineLoop; here rendered for QA. `speed01`
      // drives the piecewise GEAR MAP (audit r2): RPM climbs within a
      // gear and DROPS on upshift — the old continuous 55→205Hz sweep
      // read as a synth drone, not a kart gearbox. `dur` is the QA render
      // window. Matches AudioManager._updateEngineLoop exactly.
      const speed = clamp(opts.speed01 ?? 0.6, 0, 1);
      const d = Math.max(0.3, opts.dur ?? 2.0);
      const { rpm, local, load, ratio } = engineGear(speed);
      const lug = (1 - local) * load; // post-upshift strain (muffles top end)
      const cut = 300 + ratio * 1500 - lug * 250;
      const lvl = 0.28 + 0.64 * (0.7 * load + 0.3 * local);
      osc(ctx, target, {
        type: 'sawtooth', freq: rpm, dur: d, vol: v(lvl * 0.55), at, attack: 0.1, sustain: true, release: 0.08,
        filterType: 'lowpass', filterFreq: cut, filterQ: 0.8, lfoFreq: 24, lfoDepth: rpm * 0.012,
      });
      osc(ctx, target, {
        type: 'square', freq: rpm * 2, dur: d, vol: v(lvl * 0.22), at, attack: 0.1, sustain: true, release: 0.08,
        filterType: 'lowpass', filterFreq: cut * 1.4, filterQ: 1.2,
      });
      // Sub oscillator — matches the live engine loop (low-end body).
      osc(ctx, target, {
        type: 'sine', freq: rpm * 0.5, dur: d, vol: v(lvl * 0.5), at, attack: 0.1, sustain: true, release: 0.08,
      });
      noise(ctx, target, { dur: d, vol: v(lvl * 0.1), at, filterType: 'bandpass', freq: cut * 0.6, q: 0.5, attack: 0.1, sustain: true, release: 0.08 });
      break;
    }

    case 'boost': {
      // Turbo launch (modern arcade): kick thump + RISING noise whoosh
      // (bandpass sweep 300→3600) + a growling saw that rises in pitch
      // AND opens its lowpass (the flame body) + fire crackle + sub drop.
      const d = 1.0;
      kick(ctx, target, { at, vol: v(0.58), freq: 150, glideTo: 45, dur: 0.22 });
      noise(ctx, target, { dur: d, vol: v(0.38), at, filterType: 'bandpass', freq: 300, q: 1.1, glideTo: 3600, attack: 0.05, sustain: true, release: 0.12 });
      osc(ctx, target, {
        type: 'sawtooth', freq: 95 * rate, glideTo: 210 * rate, dur: d * 0.9, vol: v(0.36), at, attack: 0.02,
        filterType: 'lowpass', filterFreq: 400, filterQ: 1, filterGlideTo: 3200,
      });
      noise(ctx, target, { dur: d, vol: v(0.12), at: at + 0.06, filterType: 'highpass', freq: 5200, attack: 0.06, sustain: true, release: 0.08 });
      osc(ctx, target, { type: 'sine', freq: 120 * rate, glideTo: 40 * rate, dur: 0.3, vol: v(0.6), at, attack: 0.003 });
      break;
    }

    case 'drift': {
      // Tire screech: high-Q bandpass noise squeal with wobble LFO,
      // plus a low rumble and a bright chirp layer.
      const d = 0.85;
      const src = ctx.createBufferSource();
      src.buffer = noiseBuffer(ctx);
      const flt = ctx.createBiquadFilter();
      flt.type = 'bandpass';
      flt.Q.value = 9;
      flt.frequency.setValueAtTime(950, at);
      flt.frequency.linearRampToValueAtTime(1550, at + d * 0.45);
      flt.frequency.exponentialRampToValueAtTime(1100, at + d * 0.95);
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 21;
      const lfoG = ctx.createGain();
      lfoG.gain.value = 160;
      lfo.connect(lfoG);
      lfoG.connect(flt.frequency);
      lfo.start(at);
      lfo.stop(at + d + 0.1);
      const g = ctx.createGain();
      env(g, { at, peak: v(0.3), attack: 0.04, dur: d, sustain: true, release: 0.1 });
      src.connect(flt);
      flt.connect(g);
      g.connect(target);
      src.start(at);
      src.stop(at + d + 0.1);
      noise(ctx, target, { dur: d, vol: v(0.26), at, filterType: 'lowpass', freq: 300, q: 0.8, attack: 0.03, sustain: true, release: 0.08 });
      noise(ctx, target, { dur: d * 0.7, vol: v(0.12), at: at + 0.1, filterType: 'bandpass', freq: 2400, q: 4, attack: 0.05, sustain: true, release: 0.07 });
      break;
    }

    case 'uiClick': {
      // Soft tactile click (no raw squares): a lowpassed triangle blip
      // through a gentle bandpass + a micro noise tick — feels like a
      // console menu, not a game-boy beep.
      osc(ctx, target, {
        type: 'triangle', freq: 520 * rate, glideTo: 760 * rate, dur: 0.06, vol: v(0.16), at, attack: 0.001,
        filterType: 'lowpass', filterFreq: 2400, filterQ: 0.8,
      });
      noise(ctx, target, { dur: 0.02, vol: v(0.05), at, filterType: 'bandpass', freq: 3200, q: 1.5 });
      break;
    }

    case 'uiSelect': {
      // Confirming two-tone for "Start Race" — soft lowpassed body tones
      // (no raw square) + a chime sparkle on top.
      osc(ctx, target, { type: 'triangle', freq: 523.25 * rate, dur: 0.09, vol: v(0.2), at, attack: 0.002, filterType: 'lowpass', filterFreq: 2600 });
      osc(ctx, target, { type: 'square', freq: 783.99 * rate, dur: 0.14, vol: v(0.12), at: at + 0.07, attack: 0.002, filterType: 'lowpass', filterFreq: 3200, filterQ: 1 });
      chime(ctx, target, { freq: 1046.5 * rate, dur: 0.3, vol: v(0.14), at: at + 0.12, partials: [1, 2, 3] });
      break;
    }

    case 'driftReleaseMiniBoost': {
      // Drift-release pop: kick tick + quick rising blip + tight whoosh
      // (bandpass noise sweep) + a sparkle on top — the arcade
      // "release the boost" feel, not a beep.
      kick(ctx, target, { at, vol: v(0.5), freq: 190, glideTo: 55, dur: 0.12 });
      osc(ctx, target, { type: 'triangle', freq: 320 * rate, glideTo: 1100 * rate, dur: 0.16, vol: v(0.28), at, attack: 0.002 });
      noise(ctx, target, { dur: 0.24, vol: v(0.22), at: at + 0.01, filterType: 'bandpass', freq: 1300, q: 1.2, glideTo: 3800, attack: 0.02, timeConstant: 0.08 });
      chime(ctx, target, { freq: 1568 * rate, dur: 0.25, vol: v(0.18), at: at + 0.06, partials: [1, 2, 3] });
      break;
    }

    case 'offroad': {
      // Gravel/grass rumble while the kart is on the shoulder.
      noise(ctx, target, { dur: 0.7, vol: v(0.16), at, filterType: 'bandpass', freq: 420, q: 1.1, attack: 0.05, sustain: true, release: 0.15 });
      noise(ctx, target, { dur: 0.55, vol: v(0.08), at: at + 0.02, filterType: 'highpass', freq: 3000, attack: 0.06, sustain: true, release: 0.1 });
      break;
    }

    case 'itemPickup': {
      // Item-box pickup: sub pop + bright chime arpeggio C6-E6-G6-C7 +
      // air shimmer. The pop gives it physical weight (layered pickup).
      kick(ctx, target, { at, vol: v(0.26), freq: 200, glideTo: 60, dur: 0.14 });
      osc(ctx, target, { type: 'sine', freq: 200 * rate, glideTo: 800 * rate, dur: 0.09, vol: v(0.26), at, attack: 0.002 });
      const notes = [N.C6, N.E6, N.G6, N.C7];
      let t = at;
      for (const n of notes) {
        chime(ctx, target, { freq: n * rate, dur: 0.24, vol: v(0.36), at: t, partials: [1, 2, 3, 4, 5] });
        t += 0.055;
      }
      noise(ctx, target, { dur: 0.45, vol: v(0.16), at: t, filterType: 'highpass', freq: 7500, timeConstant: 0.12 });
      break;
    }

    case 'useItem': {
      // Power-up equip: sub pop + bright upward blip + sparkle — reads
      // as a punchy item grab, not a game-boy beep.
      kick(ctx, target, { at, vol: v(0.35), freq: 220, glideTo: 70, dur: 0.1 });
      osc(ctx, target, { type: 'triangle', freq: 800 * rate, glideTo: 1500 * rate, dur: 0.12, vol: v(0.32), at, attack: 0.002 });
      osc(ctx, target, { type: 'sine', freq: 1800 * rate, dur: 0.06, vol: v(0.12), at: at + 0.02, attack: 0.002 });
      chime(ctx, target, { freq: 2093 * rate, dur: 0.18, vol: v(0.1), at: at + 0.05, partials: [1, 2, 3] });
      break;
    }

    case 'shell': {
      // Fast whoosh + whistling projectile.
      const d = 0.55;
      noise(ctx, target, { dur: d, vol: v(0.4), at, filterType: 'bandpass', freq: 380, q: 0.9, glideTo: 2600, attack: 0.04, sustain: true, release: 0.08 });
      osc(ctx, target, {
        type: 'sine', freq: 520 * rate, glideTo: 1250 * rate, dur: d, vol: v(0.22), at: at + 0.02,
        attack: 0.05, sustain: true, release: 0.07, lfoFreq: 20, lfoDepth: 12,
      });
      break;
    }

    case 'redShell': {
      // Angrier whoosh: growling saw + fast noise sweep + warble.
      const d = 0.5;
      osc(ctx, target, {
        type: 'sawtooth', freq: 240 * rate, glideTo: 100 * rate, dur: d, vol: v(0.4), at, attack: 0.005,
        filterType: 'lowpass', filterFreq: 1100, filterQ: 0.8, filterGlideTo: 450,
      });
      noise(ctx, target, { dur: d, vol: v(0.35), at, filterType: 'bandpass', freq: 260, q: 1, glideTo: 2100, attack: 0.02, sustain: true, release: 0.06 });
      osc(ctx, target, { type: 'square', freq: 800 * rate, glideTo: 1400 * rate, dur: 0.22, vol: v(0.15), at: at + 0.03, attack: 0.003, filterType: 'highpass', filterFreq: 2000 });
      break;
    }

    case 'banana': {
      // Slip-slap: filtered noise impact sweep + springy boing on a fat
      // sine body + a high "slip!" blip. Keeps the cartoon spring but
      // the slap gives it physical weight.
      noise(ctx, target, { dur: 0.09, vol: v(0.4), at, filterType: 'bandpass', freq: 1500, q: 1.4, glideTo: 320, attack: 0.001, timeConstant: 0.05 });
      const f0 = 235 * rate;
      const o = ctx.createOscillator();
      o.type = 'triangle';
      o.frequency.setValueAtTime(Math.max(30, f0), at);
      o.frequency.exponentialRampToValueAtTime(Math.max(30, f0 * 0.4), at + 0.06);
      o.frequency.exponentialRampToValueAtTime(Math.max(30, f0 * 0.85), at + 0.13);
      o.frequency.exponentialRampToValueAtTime(Math.max(30, f0 * 0.52), at + 0.22);
      o.frequency.exponentialRampToValueAtTime(Math.max(30, f0 * 0.72), at + 0.32);
      const g = ctx.createGain();
      env(g, { at, peak: v(0.45), attack: 0.004, timeConstant: 0.18 });
      o.connect(g);
      g.connect(target);
      o.start(at);
      o.stop(at + 0.6);
      osc(ctx, target, { type: 'sine', freq: Math.max(30, f0 * 0.5), glideTo: Math.max(30, f0 * 0.25), dur: 0.3, vol: v(0.35), at, attack: 0.002, timeConstant: 0.15 });
      osc(ctx, target, { type: 'sine', freq: 1700 * rate, dur: 0.05, vol: v(0.16), at: at + 0.01, attack: 0.002 });
      break;
    }

    case 'star': {
      // Magical shimmer arpeggio up + sparkle chord + air.
      const notes = [N.C6, N.D6, N.E6, N.G6, N.A6, N.C7];
      let t = at;
      for (const n of notes) {
        chime(ctx, target, { freq: n * rate, dur: 0.5, vol: v(0.35), at: t, partials: [1, 2, 3, 4, 5] });
        t += 0.06;
      }
      noise(ctx, target, { dur: 0.7, vol: v(0.12), at: at + 0.1, filterType: 'highpass', freq: 9000, timeConstant: 0.15 });
      chime(ctx, target, { freq: N.C7 * rate, dur: 0.7, vol: v(0.25), at: t, partials: [1, 2, 3, 4, 5, 6] });
      break;
    }

    case 'lightning': {
      // Electric zap (pitch drop) + crackle bursts + fading rumble.
      osc(ctx, target, {
        type: 'sawtooth', freq: 2600 * rate, glideTo: 160 * rate, dur: 0.2, vol: v(0.5), at, attack: 0.001,
        filterType: 'highpass', filterFreq: 400,
      });
      osc(ctx, target, {
        type: 'square', freq: 1500 * rate, glideTo: 120 * rate, dur: 0.24, vol: v(0.28), at: at + 0.01, attack: 0.001,
        filterType: 'highpass', filterFreq: 600,
      });
      const crack = [0.22, 0.3, 0.37, 0.46, 0.55, 0.64];
      for (const off of crack) {
        noise(ctx, target, { dur: 0.03, vol: v(0.25), at: at + off, filterType: 'bandpass', freq: 3200, q: 2.5 });
      }
      osc(ctx, target, { type: 'sine', freq: 90 * rate, glideTo: 40 * rate, dur: 0.35, vol: v(0.3), at: at + 0.15, attack: 0.005 });
      break;
    }

    case 'crash': {
      // FAT impact (arcade, not 8-bit): sub kick body (sine 120→38Hz) +
      // lowpassed noise burst with a pitch-drop sweep + a metallic clank
      // (bandpassed square gliding down) + a fast shard-hiss layer.
      kick(ctx, target, { at, vol: v(0.65), freq: 120, glideTo: 38, dur: 0.3 });
      noise(ctx, target, {
        dur: 0.42, vol: v(0.43), at, filterType: 'lowpass', freq: 6000, q: 0.6, // QA: dry peak headroom
        glideTo: 160, attack: 0.001, timeConstant: 0.14,
      });
      osc(ctx, target, {
        type: 'square', freq: 920 * rate, glideTo: 300 * rate, dur: 0.16, vol: v(0.22), at: at + 0.004, attack: 0.001,
        filterType: 'bandpass', filterFreq: 1500, filterQ: 2.2, filterGlideTo: 450,
      });
      noise(ctx, target, { dur: 0.2, vol: v(0.16), at: at + 0.01, filterType: 'bandpass', freq: 3200, q: 2, glideTo: 900, attack: 0.002, timeConstant: 0.05 });
      break;
    }

    case 'driftReady': {
      // Distinct rising chime when the drift charge hits the release point
      // (audit v5 F5: was reusing the overtake blip — same sound, two events).
      // Now with a soft noise tick for presence.
      osc(ctx, target, { type: 'sine', freq: 660 * rate, glideTo: 990 * rate, dur: 0.09, vol: v(0.3), at, attack: 0.002 });
      osc(ctx, target, { type: 'sine', freq: 1320 * rate, dur: 0.06, vol: v(0.12), at: at + 0.05, attack: 0.002 });
      noise(ctx, target, { dur: 0.03, vol: v(0.05), at, filterType: 'highpass', freq: 5500 });
      break;
    }

    case 'posDown': {
      // Descending two-tone (lost a place): triangle lead + lowpassed
      // square body for weight (not a raw square — filtered and fat).
      osc(ctx, target, { type: 'triangle', freq: 520 * rate, glideTo: 300 * rate, dur: 0.14, vol: v(0.26), at, attack: 0.003 });
      osc(ctx, target, { type: 'square', freq: 520 * rate, glideTo: 300 * rate, dur: 0.14, vol: v(0.14), at, attack: 0.003, filterType: 'lowpass', filterFreq: 1800 });
      osc(ctx, target, { type: 'sine', freq: 300 * rate, glideTo: 180 * rate, dur: 0.14, vol: v(0.26), at: at + 0.1, attack: 0.003 });
      break;
    }

    case 'posUp': {
      // Ascending two-tone (overtook someone): triangle lead + lowpassed
      // square body for weight + sine tail.
      osc(ctx, target, { type: 'triangle', freq: 380 * rate, glideTo: 560 * rate, dur: 0.12, vol: v(0.26), at, attack: 0.003 });
      osc(ctx, target, { type: 'square', freq: 380 * rate, glideTo: 560 * rate, dur: 0.12, vol: v(0.14), at, attack: 0.003, filterType: 'lowpass', filterFreq: 1800 });
      osc(ctx, target, { type: 'sine', freq: 620 * rate, glideTo: 820 * rate, dur: 0.14, vol: v(0.26), at: at + 0.08, attack: 0.003 });
      break;
    }

    case 'landing': {
      // Touchdown (audit UX-F3): sub thump + filtered noise puff — a
      // grounded impact, not a beep.
      kick(ctx, target, { at, vol: v(0.5), freq: 120, glideTo: 50, dur: 0.16, click: 0.2 });
      noise(ctx, target, { dur: 0.18, vol: v(0.2), at, filterType: 'lowpass', freq: 900, attack: 0.003, timeConstant: 0.06 });
      break;
    }

    case 'countdown': {
      // Stadium countdown tone: fat lowpassed square + sine sub body +
      // soft octave — a full enveloped tone, not a thin beep.
      const f = 660 * rate;
      osc(ctx, target, {
        type: 'square', freq: f, dur: 0.26, vol: v(0.3), at, attack: 0.006, sustain: true, release: 0.06,
        filterType: 'lowpass', filterFreq: 1800, filterQ: 0.9,
      });
      osc(ctx, target, { type: 'sine', freq: Math.max(30, f * 0.5), dur: 0.26, vol: v(0.35), at, attack: 0.006, sustain: true, release: 0.06 });
      osc(ctx, target, { type: 'sine', freq: Math.max(30, f * 2), dur: 0.2, vol: v(0.1), at: at + 0.005, attack: 0.006, sustain: true, release: 0.04 });
      break;
    }

    case 'go': {
      // Race start: kick punch + fat horn blast E5 -> A5 with sub body

  altin: { ic: '👑', tr: 'Altın Mod', en: 'Gold Mode' },
};
function rollItem(k) {
  const n = karts.length, pos = k.place || n, f = n > 1 ? (pos - 1) / (n - 1) : 0.5;
  const tab = f < 0.25 ? ROLL_FRONT : f > 0.7 ? ROLL_BACK : ROLL_MID;
  const tot = tab.reduce((a, b) => a + b[1], 0); let r = Math.random() * tot;
  for (const [id, w] of tab) { r -= w; if (r <= 0) return id; } return tab[0][0];
}

// ---------- world objects: item boxes + ramps ----------
let boxes = [], ramps = [], projs = [], traps = [];
const boxTex = canvasTex(256, 256, (c, w, h) => { const g = c.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#ffd41f'); g.addColorStop(1, '#ff8a1a'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.fillStyle = '#e22511'; c.fillRect(0, 108, w, 40); c.fillRect(108, 0, 40, h); c.fillStyle = '#fff'; c.font = '900 150px Rubik, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineWidth = 14; c.strokeStyle = '#022753'; c.strokeText('?', w / 2, h / 2 + 8); c.fillText('?', w / 2, h / 2 + 8); });
const boxMat = new THREE.MeshStandardMaterial({ map: boxTex, roughness: 0.35, emissive: 0x442200, transparent: true, opacity: 0.95 });
const boxGeo = new RoundedBoxGeometry(2.2, 2.2, 2.2, 3, 0.35);
function lowCurveIdx(tr, a, b) { let best = Math.round(a * tr.N), bk = 9; for (let i = Math.round(a * tr.N); i < Math.round(b * tr.N); i++) { const k = tr.K[i % tr.N] + tr.K[(i + 8) % tr.N]; if (k < bk) { bk = k; best = i % tr.N; } } return best; }
function buildItems(tr, g) {
  boxes = []; ramps = []; projs.forEach((p) => scene.remove(p.m)); traps.forEach((p) => scene.remove(p.m)); projs = []; traps = [];
  if (race && race.mode === 'time') return;
  for (const f of [0.06, 0.38, 0.7]) { const i = lowCurveIdx(tr, f, f + 0.1);
    for (const o of [-0.33, -0.11, 0.11, 0.33]) { const p = tr.P[i].clone().addScaledVector(tr.Nm[i], o * tr.W); const m = new THREE.Mesh(boxGeo, boxMat); m.position.set(p.x, 2, p.z); m.castShadow = true; g.add(m); boxes.push({ m, x: p.x, z: p.z, off: 0, ph: Math.random() * 6 }); } }
  // jump ramps on two straights
  const rampT = canvasTex(128, 256, (c, w, h) => { for (let i = 0; i < 8; i++) { c.fillStyle = i % 2 ? '#ffd41f' : '#022753'; c.fillRect(0, i * 32, w, 32); } c.fillStyle = '#e22511'; c.beginPath(); c.moveTo(64, 20); c.lineTo(110, 90); c.lineTo(18, 90); c.fill(); });
  for (const [a, b] of [[0.22, 0.34], [0.52, 0.64]]) { const i = lowCurveIdx(tr, a, b), P = tr.P[i], t = tr.Tn[i];
    const geo = new THREE.BufferGeometry(), L = 5, Wd = tr.W * 0.55, H = 1.3;
    const v = [-Wd / 2, 0, L / 2, Wd / 2, 0, L / 2, -Wd / 2, H, -L / 2, Wd / 2, H, -L / 2, -Wd / 2, 0, -L / 2, Wd / 2, 0, -L / 2];
    geo.setAttribute('position', new THREE.Float32BufferAttribute(v, 3)); geo.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 1, 0, 0, 1, 1, 1, 0, 1, 1, 1], 2));
    geo.setIndex([0, 1, 2, 1, 3, 2, 2, 3, 4, 3, 5, 4, 0, 2, 4, 1, 5, 3]); geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, phys(0xffffff, { map: rampT, roughness: 0.5, side: THREE.DoubleSide })); m.position.set(P.x, 0.02, P.z); m.rotation.y = Math.atan2(-t.x, -t.z); m.castShadow = true; m.receiveShadow = true; g.add(m);
    ramps.push({ i, x: P.x, z: P.z, tx: t.x, tz: t.z, nx: tr.Nm[i].x, nz: tr.Nm[i].z, w: Wd }); }
}

// ---------- hits ----------
function hitKart(k, by, kind) {
  if (k.done || k.starT > 0 || k.spinT > 0) return false;
  if (k.shieldT > 0) { k.shieldT = 0; puff(k.x, 2, k.z, 'blue', 10, 6); if (k.me) AUD.play('uiClick', { volume: 0.6 }); return false; }
  k.spinT = kind === 'big' ? 1.4 : 1.05; k.s *= 0.45; k.drift = false; k.sup = Math.min(100, k.sup + 12); k.vy = Math.max(k.vy, kind === 'big' ? 9 : 5);
  puff(k.x, 1.5, k.z, 'spark', 10, 7);
  if (k.me) { shake = Math.max(shake, 0.45); AUD.play('crash', { volume: 0.7 }); big(T('AY!', 'OUCH!'), 'lap'); }
  else if (by && by.me) { AUD.play('posUp', { volume: 0.5 }); toastHit(k); }
  return true;
}
let hitToastT = 0; function toastHit(k) { if (hitToastT > 0) return; hitToastT = 1.2; toast(`💥 ${k.name}!`, 900); }

// ---------- projectiles (ride the track spline, so they never clip through walls) ----------
const PG = { fuze: new THREE.ConeGeometry(0.5, 2.2, 10), top: new THREE.SphereGeometry(1, 20, 14), dev: new THREE.SphereGeometry(3, 28, 18), ates: new THREE.SphereGeometry(0.9, 14, 10) };
const ballTex = canvasTex(256, 128, (c) => { ['#e22511', '#ffd41f', '#2a80dc', '#2fa043'].forEach((col, i) => { c.fillStyle = col; c.fillRect(i * 64, 0, 64, 128); }); c.fillStyle = '#fff'; c.beginPath(); c.arc(128, 64, 26, 0, 7); c.fill(); });
const PM = { fuze: new THREE.MeshStandardMaterial({ color: 0x2a80dc, emissive: 0x1144aa, roughness: 0.3 }), top: new THREE.MeshStandardMaterial({ map: ballTex, roughness: 0.3 }), ates: new THREE.MeshBasicMaterial({ color: 0xffa42a }) };
PM.dev = PM.top;
function lateral(tr, i, x, z) { const P = tr.P[i], n = tr.Nm[i]; return (x - P.x) * n.x + (z - P.z) * n.z; }
function fire(k, type, o = {}) {
  const tr = world.tr, i0 = (k.idx + (o.back ? -4 : 4) + tr.N) % tr.N;
  const m = new THREE.Mesh(PG[type], PM[type]); if (type === 'fuze') m.rotation.x = -Math.PI / 2; m.castShadow = true; scene.add(m);
  const p = { type, m, f: i0, off: o.off ?? lateral(tr, k.idx, k.x, k.z), v: o.v || (type === 'dev' ? 30 : type === 'top' ? 62 : 54) * (o.back ? -1 : 1), life: o.life || (type === 'dev' ? 9 : 5), owner: k, target: o.target || null, r: type === 'dev' ? 3.4 : 1.6, safe: 0.4, y: type === 'dev' ? 3 : 1.4 };
  projs.push(p); return p;
}
function aheadOf(k, maxD = 0.25) { let best = null, bd = 9; for (const o of karts) { if (o === k || o.done) continue; const d = o.prog - k.prog; if (d > 0 && d < maxD && d < bd) { bd = d; best = o; } } return best; }
function stepProjs(dt) {
  const tr = world.tr, N = tr.N;
  for (let n = projs.length - 1; n >= 0; n--) {
    const p = projs[n]; p.life -= dt; p.safe -= dt;
    p.f = (p.f + p.v * dt / 1.2 + N) % N; const i = Math.floor(p.f), j = (i + 1) % N, u = p.f - i;
    if (p.target && !p.target.done) { const want = lateral(tr, i, p.target.x, p.target.z); p.off += Math.max(-1, Math.min(1, want - p.off)) * dt * 14; }
    const lim = tr.W / 2 - 1; if (Math.abs(p.off) > lim) { p.off = Math.sign(p.off) * lim; }
    const P = tr.P[i].clone().lerp(tr.P[j], u), Nm = tr.Nm[i]; const x = P.x + Nm.x * p.off, z = P.z + Nm.z * p.off;
    p.m.position.set(x, p.y + (p.type === 'dev' ? 0 : Math.sin(p.life * 12) * 0.2), z);
    const t = tr.Tn[i]; if (p.type === 'fuze' || p.type === 'ates') { p.m.rotation.set(-Math.PI / 2, 0, -Math.atan2(t.x, -t.z) * (p.v > 0 ? 1 : -1)); if (Math.random() < 0.6) puff(x, p.y, z, p.type === 'ates' ? 'fire' : 'blue', 1, 0.6); }
    else p.m.rotation.x -= p.v * dt / 2;
    let gone = p.life <= 0;
    for (const k of karts) { if (gone) break; if (k === p.owner && p.safe > 0) continue; if ((k.x - x) ** 2 + (k.z - z) ** 2 < (p.r + 1.4) ** 2 && k.y < p.y + 2) { hitKart(k, p.owner, p.type === 'dev' ? 'big' : ''); if (p.type !== 'dev') gone = true; } }
    if (gone) { puff(x, p.y, z, p.type === 'fuze' ? 'blue' : 'spark', 8, 5); scene.remove(p.m); projs.splice(n, 1); }
  }
}
// ---------- traps ----------
const TG = { sakiz: new THREE.SphereGeometry(1.3, 16, 10), buz: new RoundedBoxGeometry(3, 2.4, 1.4, 2, 0.3) };
const TM = { sakiz: new THREE.MeshStandardMaterial({ color: 0xff6fb5, roughness: 0.25, emissive: 0x330011 }), buz: new THREE.MeshStandardMaterial({ color: 0xbfeaff, roughness: 0.1, transparent: true, opacity: 0.8, emissive: 0x113355 }) };
function drop(k, type, off = 0) {
  const fx = fwdX(k), fz = fwdZ(k), rx = -fz, rz = fx; const x = k.x - fx * 3.4 + rx * off, z = k.z - fz * 3.4 + rz * off;
  const m = new THREE.Mesh(TG[type], TM[type]); m.position.set(x, type === 'sakiz' ? 0.5 : 1.2, z); m.scale.y = type === 'sakiz' ? 0.45 : 1; m.rotation.y = k.h; m.castShadow = true; scene.add(m);
  traps.push({ type, m, x, z, life: type === 'buz' ? 14 : 30, owner: k, safe: 0.8 });
}
function stepTraps(dt) {
  for (let n = traps.length - 1; n >= 0; n--) { const p = traps[n]; p.life -= dt; p.safe -= dt; let gone = p.life <= 0;
    for (const k of karts) { if (gone) break; if (k === p.owner && p.safe > 0) continue; if ((k.x - p.x) ** 2 + (k.z - p.z) ** 2 < 5.5 && k.y < 1.5) { hitKart(k, p.owner); gone = true; } }
    if (gone) { puff(p.x, 1, p.z, p.type === 'buz' ? 'blue' : 'c0', 8, 4); scene.remove(p.m); traps.splice(n, 1); } }
}

// ---------- using items / supers ----------
function useItem(k) {
  if (!k.item || k.rollT > 0 || k.spinT > 0 || !race || race.phase !== 'go') return;
  const it = k.item;
  if (it === 'turbo3') { k.padT = 1.0; k.padLvl = 0; k.itemN = (k.itemN || 3) - 1; if (k.me) { AUD.play('boost', { volume: 0.6 }); shake = Math.max(shake, 0.12); } if (k.itemN > 0) return; }
  else if (it === 'fuze') { fire(k, 'fuze', { target: aheadOf(k, 0.3) }); if (k.me) AUD.play('useItem', { volume: 0.6 }); }
  else if (it === 'top') { fire(k, 'top'); if (k.me) AUD.play('shell', { volume: 0.6 }); }
  else if (it === 'sakiz') { drop(k, 'sakiz'); if (k.me) AUD.play('banana', { volume: 0.6 }); }
  else if (it === 'kalkan') { k.shieldT = 9; if (k.me) AUD.play('uiSelect', { volume: 0.6 }); }
  else if (it === 'altin') { k.starT = 6; k.padT = 0.6; if (k.me) { AUD.play('star', { volume: 0.7 }); big(T('ALTIN FLIX!', 'GOLDEN FLIX!'), 'win'); } }
  else if (it === 'simsek') { for (const o of karts) if (o !== k && o.prog > k.prog) hitKart(o, k); flash(); AUD.play('lightning', { volume: k.me ? 0.7 : 0.4 }); }
  k.item = null; k.itemN = 0;
}
function useSuper(k) {
  if (k.sup < 100 || k.spinT > 0 || !race || race.phase !== 'go' || k.done) return;
  k.sup = 0; const id = k.did, tr = world.tr;
  if (k.me) { big(T(SUPERS[id].tr, SUPERS[id].en).toUpperCase() + '!', 'win'); shake = Math.max(shake, 0.3); }
  AUD.play('star', { volume: k.me ? 0.75 : 0.35 });
  if (id === 'flix') { const tg = karts.filter((o) => o !== k && o.prog > k.prog && !o.done).sort((a, b) => a.prog - b.prog).slice(0, 3); for (let n = 0; n < 3; n++) fire(k, 'ates', { target: tg[n] || null, off: (n - 1) * 3, v: 58 }); }
  else if (id === 'wu') { for (const o of karts) if (o !== k && (o.x - k.x) ** 2 + (o.z - k.z) ** 2 < 18 * 18) hitKart(o, k, 'big'); k.padT = 1.0; ring(k, 0xffd41f); }
  else if (id === 'kick') { fire(k, 'dev', { off: 0 }); k.padT = 0.6; }
  else if (id === 'flick') { const jump = Math.round(48 / 1.2), j = (k.idx + jump) % tr.N, off = Math.max(-tr.W / 3, Math.min(tr.W / 3, lateral(tr, k.idx, k.x, k.z))); puff(k.x, 1.5, k.z, 'blue', 14, 6);
    k.x = tr.P[j].x + tr.Nm[j].x * off; k.z = tr.P[j].z + tr.Nm[j].z * off; k.h = Math.atan2(-tr.Tn[j].x, -tr.Tn[j].z); k.padT = 1.0; k.shieldT = Math.max(k.shieldT, 2); puff(k.x, 1.5, k.z, 'blue', 14, 6); if (k.me) camInit = false; }
  else if (id === 'buzul') { for (const o of [-0.3, 0, 0.3]) drop(k, 'buz', o * tr.W); k.shieldT = Math.max(k.shieldT, 5); }
  else if (id === 'neon') { for (const o of karts) if (o !== k && o.prog > k.prog) hitKart(o, k); flash(0xff2d9a); }
  else if (id === 'altin') { k.starT = 8; k.padT = 1.0; }
}
function flash(col = 0xffffff) { const f = $('#flash'); if (!f) return; f.style.background = '#' + new THREE.Color(col).getHexString(); f.style.opacity = 0.7; setTimeout(() => (f.style.opacity = 0), 90); }
const ringGeo = new THREE.RingGeometry(0.8, 1.2, 40);
function ring(k, col) { const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.8, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false })); m.rotation.x = -Math.PI / 2; m.position.set(k.x, 0.6, k.z); scene.add(m); parts.push({ m, vx: 0, vy: 0, vz: 0, life: 0.6, t: 0, g: 0, grow: 20 }); }

// ---------- per-frame ----------
const shieldGeo = new THREE.SphereGeometry(2.7, 20, 14), shieldMat = new THREE.MeshBasicMaterial({ color: 0x6fd8ff, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false }), starMat = new THREE.MeshBasicMaterial({ color: 0xffd41f, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false });
function stepItems(dt) {
  const tr = world.tr; if (hitToastT > 0) hitToastT -= dt;
  for (const b of boxes) { if (b.off > 0) { b.off -= dt; b.m.visible = b.off <= 0; } b.m.rotation.y += dt * 1.6; b.m.rotation.x = Math.sin(race.t * 1.3 + b.ph) * 0.3; b.m.position.y = 2.1 + Math.sin(race.t * 2.5 + b.ph) * 0.25;
    if (b.off > 0) continue;
    for (const k of karts) if ((k.x - b.x) ** 2 + (k.z - b.z) ** 2 < 7.5) { b.off = 2.5; b.m.visible = false; puff(b.x, 2, b.z, 'c' + Math.floor(Math.random() * 4), 8, 6); k.sup = Math.min(100, k.sup + 8);
      if (!k.item) { k.item = rollItem(k); k.itemN = k.item === 'turbo3' ? 3 : 0; k.rollT = k.me ? 0.8 : 0.1; k.botHold = 0.5 + Math.random() * 2.5; if (k.me) AUD.play('itemPickup', { volume: 0.6 }); }
      break; } }
  for (const k of karts) {
    if (k.rollT > 0) k.rollT -= dt;
    if (race.phase === 'go' && !k.done) k.sup = Math.min(100, k.sup + dt * 2.2);
    // ramps
    for (const r of ramps) { const dx = k.x - r.x, dz = k.z - r.z, along = -(dx * r.tx + dz * r.tz), lat = dx * r.nx + dz * r.nz;
      if (Math.abs(along) < 2.6 && Math.abs(lat) < r.w / 2 && k.y < 0.4 && k.s > 10 && !(k.rampCd > 0)) { k.vy = 8 + k.s * 0.16; k.y = 0.5; k.air = 1; k.trick = 0; k.rampCd = 1; if (k.me) AUD.play('uiSelect', { volume: 0.3 }); if (!k.me && Math.random() < 0.6) k.trick = 1; } }
    if (k.rampCd > 0) k.rampCd -= dt;
    if (k.landed) { const v = k.landed; k.landed = 0; if (k.air) { k.air = 0; if (k.trick) { k.padT = Math.max(k.padT, 0.9); k.sup = Math.min(100, k.sup + 5); if (k.me) { big(T('HAVADA NUMARA!', 'TRICK!'), 'lap'); AUD.play('driftReleaseMiniBoost', { volume: 0.7 }); } } } if (k.me && v > 7) { AUD.play('landing', { volume: 0.5 }); shake = Math.max(shake, 0.15); } puff(k.x, 0.4, k.z, 'dust', 5, 3); }
    // golden FLIX: bump others away
    if (k.starT > 0) for (const o of karts) if (o !== k && (o.x - k.x) ** 2 + (o.z - k.z) ** 2 < 12) hitKart(o, k);
    // visuals
    const v = k.vis; if (!v.sh) { v.sh = new THREE.Mesh(shieldGeo, shieldMat); v.sh.position.y = 1.6; v.g.add(v.sh); v.st = new THREE.Mesh(shieldGeo, starMat); v.st.position.y = 1.6; v.g.add(v.st); }
    v.sh.visible = k.shieldT > 0 && (k.shieldT > 1.5 || Math.sin(race.t * 30) > 0); v.st.visible = k.starT > 0; if (v.st.visible) v.st.scale.setScalar(1 + Math.sin(race.t * 20) * 0.06);
    if (k.starT > 0 && Math.random() < 0.4) puff(k.x + (Math.random() - 0.5) * 3, 1 + Math.random() * 2, k.z + (Math.random() - 0.5) * 3, 'c1', 1, 1);
    if (!k.me && race.phase === 'go' && !k.done) botItems(k, dt);
  }
  stepProjs(dt); stepTraps(dt);
}
function botItems(k, dt) {
  if (k.item && !(k.rollT > 0)) { k.botHold -= dt; if (k.botHold <= 0) {
    const it = k.item, tgt = aheadOf(k, 0.12);
    if ((it === 'fuze' || it === 'top') && !tgt && k.botHold > -4) return;
    if (it === 'sakiz' && k.botHold > -3 && !karts.some((o) => o !== k && k.prog - o.prog > 0 && k.prog - o.prog < 0.05)) return;
    useItem(k); if (k.item === 'turbo3') k.botHold = 0.8; } }
  if (k.sup >= 100) { k.supHold = (k.supHold ?? Math.random() * 4) - dt; if (k.supHold <= 0) { k.supHold = null; useSuper(k); } }
}
function clearItems() { projs.forEach((p) => scene.remove(p.m)); traps.forEach((p) => scene.remove(p.m)); projs = []; traps = []; }

</script>
