<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#222}</style></head><body>
<script>
// 2D cartoon icon illustrations: thick ink outlines, glossy gradients, speed lines (style of the reference sheet)
const Q = new URLSearchParams(location.search), G = Q.get('g') || 'K', N = +(Q.get('n') || 1), SZ = +(Q.get('s') || 2048);
const cv = document.createElement('canvas'); cv.width = cv.height = SZ; document.body.appendChild(cv);
let c = cv.getContext('2d'); c.scale(SZ / 1024, SZ / 1024); c.lineJoin = 'round'; c.lineCap = 'round';
const INK = '#1b1330', TAU = Math.PI * 2;
let seed = 7 + N * 13; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const lerp = (a, b, t) => a + (b - a) * t;
function shadeHex(h, k) { const n = parseInt(h.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; const f = k < 0 ? 0 : 255, t = Math.abs(k); r = Math.round(lerp(r, f, t)); g = Math.round(lerp(g, f, t)); b = Math.round(lerp(b, f, t)); return `rgb(${r},${g},${b})`; }
const lg = (x0, y0, x1, y1, stops) => { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const rg = (x, y, r0, r1, stops) => { const g = c.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
function ink(w = 10) { if (!IW) return; c.lineWidth = w * IW; c.strokeStyle = INKC; c.stroke(); }
function ellipse(x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); }

// ---------- backgrounds ----------
function sky(top = '#0a6cff', bot = '#9be3ff') { c.fillStyle = lg(0, 0, 0, 1024, [[0, top], [0.7, shadeHex(bot, -0.1)], [1, bot]]); c.fillRect(0, 0, 1024, 1024); }
function cloud(x, y, s) {
  c.save(); c.translate(x, y); c.scale(s, s);
  const blobs = [[-80, 10, 55], [-20, -25, 70], [55, -5, 58], [105, 18, 42], [20, 25, 60], [-60, 30, 40]];
  c.beginPath(); for (const [bx, by, r] of blobs) { c.moveTo(bx + r, by); c.arc(bx, by, r, 0, TAU); }
  c.lineWidth = 14; c.strokeStyle = '#7fb2ee'; c.stroke();
  c.fillStyle = lg(0, -90, 0, 80, [[0, '#ffffff'], [0.65, '#f1f8ff'], [1, '#c6e2ff']]); c.fill();
  c.restore();
}
function speed(cx, cy, n = 30, r0 = 360, col = 'rgba(255,255,255,.85)', wmax = 16) {
  c.save(); for (let i = 0; i < n; i++) { const a = rnd() * TAU, d0 = r0 + rnd() * 160, d1 = d0 + 180 + rnd() * 420, w = 4 + rnd() * wmax;
    const x0 = cx + Math.cos(a) * d0, y0 = cy + Math.sin(a) * d0, x1 = cx + Math.cos(a) * d1, y1 = cy + Math.sin(a) * d1, nx = -Math.sin(a) * w / 2, ny = Math.cos(a) * w / 2;
    c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1 + nx, y1 + ny); c.lineTo(x1 - nx, y1 - ny); c.closePath(); c.fillStyle = col; c.fill(); } c.restore();
}
function streaks(x0, y0, x1, y1, n, spread, col = 'rgba(255,255,255,.9)') { // parallel motion streaks behind a moving object
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L;
  c.save(); c.lineCap = 'round'; for (let i = 0; i < n; i++) { const o = (i / (n - 1) - 0.5) * spread + (rnd() - 0.5) * 20, k0 = rnd() * 0.25, k1 = 0.55 + rnd() * 0.45;
    c.beginPath(); c.moveTo(x0 + dx * k0 + nx * o, y0 + dy * k0 + ny * o); c.lineTo(x0 + dx * k1 + nx * o, y0 + dy * k1 + ny * o); c.strokeStyle = col; c.lineWidth = 5 + rnd() * 9; c.stroke(); } c.restore();
}
function rays(cx, cy, n, c1, c2) { c.save(); c.fillStyle = c1; c.fillRect(0, 0, 1024, 1024); for (let i = 0; i < n; i++) { const a0 = i / n * TAU, a1 = (i + 0.5) / n * TAU; c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, 2000, a0, a1); c.closePath(); c.fillStyle = i % 2 ? c1 : c2; c.fill(); } c.restore(); }
function sparkle(x, y, s, col = '#fff') { c.save(); c.translate(x, y); c.beginPath(); for (let i = 0; i < 8; i++) { const a = i / 8 * TAU, r = i % 2 ? s * 0.28 : s; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); } c.closePath(); c.fillStyle = col; c.fill(); c.restore(); }
function vignette() { c.fillStyle = rg(512, 512, 380, 760, [[0, 'rgba(0,0,40,0)'], [1, 'rgba(0,10,60,.35)']]); c.fillRect(0, 0, 1024, 1024); }

// ---------- KICK UP: the FLIX toy (from the game's drawFlix, upgraded with volume) ----------
const SKIN = {base: '#ff7a00', f: ['#ff3b3b', '#ffc21a', '#2ec27e', '#2f80ff', '#ff5fb8']};
function feather(L, w, col) {
  c.beginPath(); c.moveTo(0, 0); c.bezierCurveTo(-w * 1.1, -L * 0.3, -w * 0.9, -L * 0.8, 0, -L); c.bezierCurveTo(w * 0.9, -L * 0.8, w * 1.1, -L * 0.3, 0, 0); c.closePath();
  c.fillStyle = lg(-w, 0, w, 0, [[0, shadeHex(col, 0.28)], [0.5, col], [1, shadeHex(col, -0.28)]]); c.fill(); ink(10);
  // vane notches + rib
  c.save(); c.clip(); c.strokeStyle = 'rgba(0,0,0,.16)'; c.lineWidth = 4; for (let k = 0.3; k < 0.95; k += 0.13) { c.beginPath(); c.moveTo(0, -L * k); c.lineTo(w, -L * (k - 0.09)); c.moveTo(0, -L * k); c.lineTo(-w, -L * (k - 0.09)); c.stroke(); }
  c.beginPath(); c.ellipse(-w * 0.38, -L * 0.55, w * 0.18, L * 0.22, 0.08, 0, TAU); c.fillStyle = 'rgba(255,255,255,.45)'; c.fill(); c.restore();
  c.beginPath(); c.moveTo(0, -6); c.quadraticCurveTo(w * 0.08, -L * 0.5, 0, -L * 0.9); c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 6; c.stroke();
}
function toy(x, y, ang, r, o = {}) {
  const S = o.skin || SKIN, n = S.f.length, spread = o.spread ?? 1.15;
  c.save(); c.translate(x, y); c.rotate(ang);
  const baseY = r * 0.55;
  for (let i = 0; i < n; i++) { const k = i / (n - 1) - 0.5, a = k * spread; c.save(); c.translate(k * r * 0.5, baseY - r * 0.2); c.rotate(a); feather(r * (1.85 - Math.abs(k) * 0.25), r * 0.36, S.f[(i + (o.shift || 0)) % n]); c.restore(); }
  // collar where feathers enter
  ellipse(0, baseY - r * 0.12, r * 0.46, r * 0.13); c.fillStyle = lg(-r * 0.5, 0, r * 0.5, 0, [[0, '#ffe27a'], [0.5, '#ffc20e'], [1, '#c98a00']]); c.fill(); ink(10);
  // rubber cap: a dome
  c.beginPath(); c.moveTo(-r * 0.52, baseY - r * 0.02); c.bezierCurveTo(-r * 0.58, baseY + r * 0.62, r * 0.58, baseY + r * 0.62, r * 0.52, baseY - r * 0.02); c.quadraticCurveTo(0, baseY + r * 0.1, -r * 0.52, baseY - r * 0.02); c.closePath();
  c.fillStyle = rg(-r * 0.18, baseY + r * 0.12, r * 0.05, r * 0.7, [[0, shadeHex(S.base, 0.45)], [0.55, S.base], [1, shadeHex(S.base, -0.35)]]); c.fill(); ink(11);
  c.beginPath(); c.ellipse(-r * 0.2, baseY + r * 0.2, r * 0.13, r * 0.07, -0.4, 0, TAU); c.fillStyle = 'rgba(255,255,255,.8)'; c.fill();
  c.restore();
}
function pole(x, top, bot, w, capTop = false, capBot = false) {
  c.save(); c.beginPath(); c.rect(x, top, w, bot - top); c.fillStyle = '#fff4ea'; c.fill(); c.clip();
  c.fillStyle = '#e22511'; for (let y = top - w * 2; y < bot + w; y += 64) { c.beginPath(); c.moveTo(x, y); c.lineTo(x + w, y - w * 0.5); c.lineTo(x + w, y - w * 0.5 + 32); c.lineTo(x, y + 32); c.fill(); }
  c.fillStyle = lg(x, 0, x + w, 0, [[0, 'rgba(255,255,255,.35)'], [0.25, 'rgba(255,255,255,0)'], [0.7, 'rgba(27,19,48,0)'], [1, 'rgba(27,19,48,.35)']]); c.fillRect(x, top, w, bot - top);
  c.restore(); c.beginPath(); c.rect(x, top, w, bot - top); ink(9);
  const cap = (cy) => { c.beginPath(); c.roundRect(x - 16, cy, w + 32, 40, 10); c.fillStyle = lg(0, cy, 0, cy + 40, [[0, '#ffe27a'], [1, '#e0a000']]); c.fill(); ink(9); };
  if (capTop) cap(top - 4); if (capBot) cap(bot - 36);
}
function balloon(x, y, r, cols) { c.save(); c.translate(x, y);
  c.beginPath(); c.moveTo(0, r * 1.25); c.bezierCurveTo(-r * 1.3, r * 0.4, -r * 1.1, -r * 1.1, 0, -r * 1.05); c.bezierCurveTo(r * 1.1, -r * 1.1, r * 1.3, r * 0.4, 0, r * 1.25); c.closePath();
  c.save(); c.clip(); for (let i = 0; i < 6; i++) { c.fillStyle = cols[i % cols.length]; c.fillRect(-r * 1.3 + i * r * 0.44, -r * 1.2, r * 0.44, r * 2.6); } c.fillStyle = lg(-r, 0, r, 0, [[0, 'rgba(255,255,255,.3)'], [1, 'rgba(0,0,0,.25)']]); c.fillRect(-r * 1.3, -r * 1.2, r * 2.6, r * 2.6); c.restore(); ink(7);
  c.beginPath(); c.moveTo(-r * 0.25, r * 1.2); c.lineTo(-r * 0.2, r * 1.55); c.moveTo(r * 0.25, r * 1.2); c.lineTo(r * 0.2, r * 1.55); ink(4);
  c.beginPath(); c.roundRect(-r * 0.25, r * 1.55, r * 0.5, r * 0.35, 5); c.fillStyle = '#8a5a2b'; c.fill(); ink(5); c.restore(); }
function chimney(x, base, w, h) { c.beginPath(); c.moveTo(x - w / 2, base); c.quadraticCurveTo(x - w * 0.42, base - h * 0.6, x - w * 0.2, base - h); c.lineTo(x + w * 0.2, base - h); c.quadraticCurveTo(x + w * 0.42, base - h * 0.6, x + w / 2, base); c.closePath();
  c.fillStyle = lg(x - w / 2, 0, x + w / 2, 0, [[0, '#e7a070'], [1, '#b8673f']]); c.fill(); ink(7);
  ellipse(x, base - h, w * 0.32, w * 0.13); c.fillStyle = '#6b3d20'; c.fill(); ink(6); c.fillStyle = '#5a2e16'; c.fillRect(x - 5, base - h * 0.45, 10, 14); c.beginPath(); c.arc(x, base - 4, 9, Math.PI, 0); c.fill(); }
function istanbul(base, s = 1, col = '#3b4bb8') { // skyline silhouette like the game's İstanbul scene
  c.save(); c.fillStyle = col; c.beginPath(); c.moveTo(0, 1024); c.lineTo(0, base);
  const pts = [[60, 0], [80, -40], [140, -40], [150, -120], [160, -40], [230, -40], [240, -70], [300, -70], [310, -40], [360, -40]]; for (const [px, py] of pts) c.lineTo(px * s, base + py * s);
  c.lineTo(370 * s, base - 40 * s); c.arc(430 * s, base - 40 * s, 60 * s, Math.PI, 0); c.lineTo(500 * s, base - 40 * s); c.lineTo(505 * s, base - 170 * s); c.lineTo(515 * s, base - 170 * s); c.lineTo(520 * s, base - 40 * s);
  c.lineTo(600 * s, base - 40 * s); c.lineTo(620 * s, base - 150 * s); c.lineTo(640 * s, base - 180 * s); c.lineTo(660 * s, base - 150 * s); c.lineTo(680 * s, base - 40 * s); c.lineTo(760 * s, base - 30 * s); c.lineTo(820 * s, base - 110 * s); c.lineTo(860 * s, base - 110 * s); c.lineTo(880 * s, base - 30 * s); c.lineTo(1024, base - 30 * s); c.lineTo(1024, 1024); c.closePath(); c.fill(); c.restore(); }
function hills(base, c1, c2) { c.beginPath(); c.moveTo(0, 1024); c.lineTo(0, base); for (let x = 0; x <= 1024; x += 128) c.quadraticCurveTo(x + 64, base - 70 - rnd() * 40, x + 128, base); c.lineTo(1024, 1024); c.closePath(); c.fillStyle = lg(0, base - 100, 0, 1024, [[0, c1], [1, c2]]); c.fill(); ink(8); }
function sneaker(x, y, ang, s, col = '#e22511') { // cartoon sneaker, toe pointing +x
  c.save(); c.translate(x, y); c.rotate(ang); c.scale(s, s);
  // sock + leg
  c.beginPath(); c.moveTo(-150, -120); c.lineTo(-210, -520); c.lineTo(-90, -540); c.lineTo(-40, -130); c.closePath(); c.fillStyle = lg(-210, 0, -40, 0, [[0, '#ffd2b0'], [1, '#d99a74']]); c.fill(); ink(12);
  c.beginPath(); c.moveTo(-160, -110); c.lineTo(-185, -270); c.lineTo(-55, -280); c.lineTo(-30, -120); c.closePath(); c.fillStyle = '#ffffff'; c.fill(); ink(12);
  c.fillStyle = '#2f80ff'; c.fillRect(-182, -250, 135, 22); c.fillStyle = '#e22511'; c.fillRect(-178, -215, 135, 22);
  // upper
  c.beginPath(); c.moveTo(-180, -10); c.bezierCurveTo(-200, -120, -150, -170, -60, -150); c.bezierCurveTo(10, -120, 60, -90, 140, -80); c.bezierCurveTo(230, -70, 250, -20, 240, 20); c.lineTo(-180, 20); c.closePath();
  c.fillStyle = lg(0, -170, 0, 20, [[0, shadeHex(col, 0.35)], [0.6, col], [1, shadeHex(col, -0.3)]]); c.fill(); ink(12);
  // toe cap + stripe + laces
  c.beginPath(); c.moveTo(120, -82); c.bezierCurveTo(220, -75, 250, -20, 240, 20); c.lineTo(110, 20); c.bezierCurveTo(100, -20, 105, -60, 120, -82); c.fillStyle = '#ffffff'; c.fill(); ink(10);
  c.beginPath(); c.moveTo(-140, -30); c.bezierCurveTo(-60, -40, 20, -80, 90, -60); c.lineTo(80, -30); c.bezierCurveTo(10, -50, -60, -10, -140, -5); c.closePath(); c.fillStyle = '#ffc20e'; c.fill(); ink(8);
  for (let i = 0; i < 4; i++) { c.beginPath(); c.moveTo(-50 + i * 38, -150 + i * 14); c.lineTo(-20 + i * 38, -120 + i * 14); c.strokeStyle = '#fff'; c.lineWidth = 12; c.stroke(); }
  // sole
  c.beginPath(); c.roundRect(-195, 10, 450, 46, 22); c.fillStyle = lg(0, 10, 0, 56, [[0, '#ffffff'], [1, '#c9d2e6']]); c.fill(); ink(12);
  c.beginPath(); c.ellipse(-110, -100, 40, 16, -0.4, 0, TAU); c.fillStyle = 'rgba(255,255,255,.55)'; c.fill();
  c.restore();
}
function kickFx(x, y, s) { c.save(); c.translate(x, y); c.beginPath(); for (let i = 0; i < 16; i++) { const a = i / 16 * TAU, r = i % 2 ? s * 0.55 : s; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); } c.closePath(); c.fillStyle = '#fff3b0'; c.fill(); ink(8); c.restore(); }

// ---------- DIREKTÖR: football, pitch, stadium, coach ----------
function ball(x, y, r, rot = 0, o = {}) {
  c.save(); c.translate(x, y);
  c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fillStyle = '#ffffff'; c.fill();
  c.save(); c.clip(); c.rotate(rot);
  const poly = (cx, cy, rad, a0, sq) => { c.beginPath(); for (let k = 0; k < 5; k++) { const a = a0 + k * TAU / 5; c[k ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * rad, cy + Math.sin(a) * rad * sq); } c.closePath(); };
  const P = o.p || '#15215c', pv = (cx, cy, rad, a0) => { const v = []; for (let k = 0; k < 5; k++) { const a = a0 + k * TAU / 5; v.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad]); } return v; };
  const fillP = (v, col) => { c.beginPath(); v.forEach(([x, y], k) => c[k ? 'lineTo' : 'moveTo'](x, y)); c.closePath(); c.fillStyle = col; c.fill(); c.lineWidth = r * 0.03; c.strokeStyle = INK; c.stroke(); };
  const C0 = pv(0, 0, r * 0.3, -Math.PI / 2), O = [];
  for (let k = 0; k < 5; k++) { const a = -Math.PI / 2 + k * TAU / 5; O.push(pv(Math.cos(a) * r * 0.86, Math.sin(a) * r * 0.86, r * 0.3, a + Math.PI)); }
  c.strokeStyle = INK; c.lineWidth = r * 0.03;
  for (let k = 0; k < 5; k++) { const a = O[k], b = O[(k + 1) % 5];
    c.beginPath(); c.moveTo(...C0[k]); c.lineTo(...a[0]); c.stroke();          // centre vertex -> outer pentagon tip
    c.beginPath(); c.moveTo(...a[1]); c.lineTo(...b[4]); c.stroke();           // hexagon edge between neighbours
    for (const v of [a[2], a[3]]) { c.beginPath(); c.moveTo(...v); c.lineTo(v[0] * 1.6, v[1] * 1.6); c.stroke(); } }
  fillP(C0, P); O.forEach((v, k) => fillP(v, k === 1 ? (o.q || '#d81e27') : P));
  c.restore();
  // volume: shading + gloss
  c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fillStyle = rg(-r * 0.35, -r * 0.4, r * 0.1, r * 1.15, [[0, 'rgba(255,255,255,.35)'], [0.55, 'rgba(255,255,255,0)'], [1, 'rgba(20,20,80,.45)']]); c.fill();
  c.beginPath(); c.arc(0, 0, r, 0, TAU); ink(Math.max(8, r * 0.05));
  c.beginPath(); c.ellipse(-r * 0.4, -r * 0.45, r * 0.25, r * 0.12, -0.7, 0, TAU); c.fillStyle = 'rgba(255,255,255,.85)'; c.fill();
  c.restore();
}
function pitch(horizon, curve = 0) { // striped grass in perspective
  const g = (y) => (y - horizon) / (1024 - horizon);
  for (let i = 0; i < 14; i++) { const y0 = horizon + Math.pow(i / 14, 1.8) * (1124 - horizon), y1 = horizon + Math.pow((i + 1) / 14, 1.8) * (1124 - horizon);
    c.fillStyle = i % 2 ? '#3fc24f' : '#2fa83f'; c.fillRect(0, y0, 1024, y1 - y0 + 1); }
  c.fillStyle = lg(0, horizon, 0, horizon + 140, [[0, 'rgba(255,255,255,.25)'], [1, 'rgba(255,255,255,0)']]); c.fillRect(0, horizon, 1024, 140);
}
function stands(top, bot) { // crowd band + roof + ad boards
  c.fillStyle = '#15215c'; c.fillRect(0, top, 1024, bot - top);
  const cs = ['#d81e27', '#ffc72c', '#ffffff', '#2f80ff', '#ff7a00'];
  for (let i = 0; i < 1400; i++) { const x = rnd() * 1024, y = top + 8 + rnd() * (bot - top - 16); c.beginPath(); c.arc(x, y, 3 + rnd() * 4, 0, TAU); c.fillStyle = cs[(rnd() * cs.length) | 0]; c.fill(); }
  for (let i = 0; i < 16; i++) { c.fillStyle = i % 2 ? '#ffc72c' : '#d81e27'; c.fillRect(i * 64, bot - 26, 64, 26); }
  c.beginPath(); c.rect(0, bot - 26, 1024, 26); ink(6);
  c.fillStyle = lg(0, top - 40, 0, top + 10, [[0, '#e8ecf5'], [1, '#9aa6c4']]); c.beginPath(); c.moveTo(0, top + 10); c.lineTo(0, top - 40); c.quadraticCurveTo(512, top - 70, 1024, top - 40); c.lineTo(1024, top + 10); c.closePath(); c.fill(); ink(7);
}
function goal(x, y, w, h, depth = 0.25) { // front view goal with net
  c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip(); c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 3;
  for (let i = 0; i <= w; i += 26) { c.beginPath(); c.moveTo(x + i, y); c.lineTo(x + i, y + h); c.stroke(); } for (let j = 0; j <= h; j += 26) { c.beginPath(); c.moveTo(x, y + j); c.lineTo(x + w, y + j); c.stroke(); } c.restore();
  c.beginPath(); c.moveTo(x, y + h); c.lineTo(x, y); c.lineTo(x + w, y); c.lineTo(x + w, y + h); c.lineWidth = 26; c.strokeStyle = INK; c.stroke(); c.lineWidth = 14; c.strokeStyle = '#ffffff'; c.stroke();
}
function lines(horizon) { c.save(); c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 10; c.beginPath(); c.ellipse(512, horizon + 330, 420, 110, 0, Math.PI * 1.02, Math.PI * 1.98); c.stroke(); c.beginPath(); c.moveTo(-50, horizon + 330); c.lineTo(1100, horizon + 330); c.stroke(); c.restore(); }
function flood(x, y, s) { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = '#cfd6e6'; c.fillRect(-6, 0, 12, 260); c.beginPath(); c.rect(-6, 0, 12, 260); ink(5); c.beginPath(); c.roundRect(-60, -50, 120, 60, 8); c.fillStyle = '#ffffff'; c.fill(); ink(7);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) { c.beginPath(); c.arc(-36 + i * 36, -34 + j * 28, 11, 0, TAU); c.fillStyle = '#fff6c0'; c.fill(); } c.restore(); }

// coach: the game's coachSVG0 (FLIX Direktör), drawn through an SVG image
function coachSVG(C, mood) {
  const SKINC = ['#f6d2b4', '#e9b48f', '#c98b62', '#9a6440', '#62402a', '#fbe3cf', '#3f2a1c'], HAIRC = ['#1c1712', '#5a3a22', '#c98e3c', '#a8441f', '#8d8f98', '#eeeeee'];
  const k = SKINC[C.skin], hc = HAIRC[C.hairc], Nv = '#15215c', c1 = C.c1 || '#d81e27', c2 = C.c2 || '#ffc72c';
  const st = `stroke="${Nv}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"`;
  let g = '';
