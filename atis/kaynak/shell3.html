<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Flix Atış</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Rubik:wght@400;500;700;800&display=swap">
<style>
:root{--navy:#022753;--red:#e22511;--yel:#ffc20e;--ink:#1b1330;--cream:#fff8ea;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#bfe6ee;font-family:Rubik,system-ui,sans-serif;color:var(--navy);touch-action:none;overscroll-behavior:none}
#gl{position:fixed;inset:0}#gl canvas{display:block;width:100%!important;height:100%!important}
.layer{position:fixed;inset:0;pointer-events:none}
.layer>*{pointer-events:auto}
[hidden]{display:none!important}
button{font-family:Rubik,sans-serif;touch-action:manipulation;cursor:pointer;border:0;color:inherit}
.big{font-family:'Barlow Condensed',Impact,sans-serif;font-style:italic;font-weight:900;line-height:.9;letter-spacing:.3px}
.pill{background:#fff;border-radius:16px;padding:8px 13px;display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px;box-shadow:0 3px 0 rgba(2,39,83,.2)}
.pill.d{background:var(--navy);color:#fff}
.pill .m{font-weight:600;opacity:.65}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--yel);color:var(--navy);border-radius:9px;padding:3px 8px;font-size:12px;font-weight:800;letter-spacing:.6px}
.pause{width:46px;height:46px;border-radius:14px;background:var(--navy);display:flex;align-items:center;justify-content:center;gap:5px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.pause i{display:block;width:6px;height:17px;background:#fff;border-radius:2px}
/* HUD */
#hud .tl{position:absolute;top:calc(var(--sat) + 12px);left:14px;pointer-events:none;display:flex;flex-direction:column;align-items:flex-start;gap:7px}
#hud .tr{position:absolute;top:calc(var(--sat) + 12px);right:14px;display:flex;gap:8px;align-items:flex-start}
#shotsBox{flex-direction:column;gap:0;padding:6px 14px 7px;border-radius:14px;align-items:center}
#shotsBox small{font-size:10px;letter-spacing:1.2px;opacity:.75;font-weight:700}
#shotsBox .big{font-size:30px}
#shotsBox.over{background:var(--red)}
#hudFe{display:flex;gap:3px}#hudFe svg{width:18px;height:22px}
#wind{position:absolute;top:calc(var(--sat) + 74px);right:14px;pointer-events:none}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 74px);background:rgba(2,39,83,.92);color:#fff;border-radius:16px;padding:10px 14px;pointer-events:none;min-width:230px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
#hint .st{font-size:15px;font-weight:700;opacity:.5;padding:3px 0 3px 26px;position:relative;white-space:nowrap}
#hint .st:before{content:'';position:absolute;left:2px;top:6px;width:14px;height:14px;border-radius:50%;border:2px solid #fff}
#hint .st.on{opacity:1}#hint .st.on:before{border-color:var(--yel);background:var(--yel)}
#hint .st.ok{opacity:.55;text-decoration:line-through}#hint .st.ok:before{background:#2fa84f;border-color:#2fa84f}
#tut{position:absolute;left:calc(50% - 26px);top:38%;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.8);border:4px solid var(--navy);pointer-events:none;animation:tut 2.4s ease-in-out infinite}
@keyframes tut{0%{transform:translate(0,0) scale(.85);opacity:0}10%{opacity:1;transform:translate(0,0) scale(1)}35%{transform:translate(-60px,0)}55%{transform:translate(20px,0)}85%{transform:translate(0,140px) scale(1.05);opacity:1}100%{transform:translate(0,140px);opacity:0}}
#aimsvg{position:absolute;inset:0;pointer-events:none}
.btn{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--navy);background:var(--yel);box-shadow:0 6px 0 #c78f00,0 10px 18px rgba(0,0,0,.22);border:3px solid var(--navy);touch-action:none}
.btn b{font-family:'Barlow Condensed',Impact,sans-serif;font-style:italic;font-weight:900;font-size:27px;line-height:1}
.btn small{font-size:10px;font-weight:700;letter-spacing:.8px}
.btn.down,.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c78f00,0 4px 8px rgba(0,0,0,.25)}
.btn.off{filter:saturate(.25) brightness(1.05);opacity:.7}
#tuy{right:18px;bottom:calc(var(--sab) + 26px);width:112px;height:112px}
#tuyRing{position:absolute;inset:-9px;pointer-events:none}
#mapB{position:absolute;left:18px;bottom:calc(var(--sab) + 34px);width:62px;height:62px;border-radius:20px;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font-size:10px;font-weight:800;letter-spacing:.8px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#mapB.on{background:var(--yel);color:var(--navy)}
#toast{position:absolute;left:0;right:0;top:calc(var(--sat) + 150px);text-align:center;pointer-events:none}
#toast .in{display:inline-block;animation:pop 1.3s ease-out forwards}
@keyframes pop{0%{transform:scale(.6);opacity:0}12%{transform:scale(1.1);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-20px);opacity:0}}
.call{font-family:'Barlow Condensed',Impact,sans-serif;font-style:italic;font-weight:900;font-size:44px;color:var(--yel);-webkit-text-stroke:2px var(--navy);paint-order:stroke fill;text-shadow:0 4px 0 var(--navy)}
.tag{display:inline-block;background:var(--red);color:#fff;font-weight:800;font-size:13px;letter-spacing:1.4px;padding:5px 10px;border-radius:8px;transform:rotate(-3deg)}
.bub{position:absolute;left:0;top:0;background:#fff;color:var(--navy);border:3px solid var(--navy);border-radius:14px;padding:5px 10px;font-family:'Barlow Condensed',Impact,sans-serif;font-style:italic;font-weight:900;font-size:20px;white-space:nowrap;pointer-events:none;box-shadow:0 3px 0 rgba(2,39,83,.25);will-change:transform}
.bub:after{content:'';position:absolute;left:50%;bottom:-11px;margin-left:-7px;border:7px solid transparent;border-top-color:var(--navy)}
/* HOME */
#homeL .top{position:absolute;top:calc(var(--sat) + 26px);left:0;right:0;display:flex;flex-direction:column;align-items:center;pointer-events:none}
#homeL .logo{width:150px;filter:drop-shadow(0 5px 0 rgba(2,39,83,.25))}
#homeL h1{font-size:96px;color:#fff;-webkit-text-stroke:3px var(--navy);paint-order:stroke fill;text-shadow:0 7px 0 var(--navy);margin-top:-8px;letter-spacing:3px}
#homeL .sub{margin-top:10px;background:var(--red);color:#fff;font-weight:800;font-size:13px;letter-spacing:1.6px;padding:6px 12px;border-radius:8px;transform:rotate(-2deg)}
#homeL .bottom{position:absolute;left:0;right:0;bottom:0;height:calc(var(--sab) + 230px);background:linear-gradient(to top,rgba(2,39,83,.55),rgba(2,39,83,0));pointer-events:none}
#homeL .left{position:absolute;left:16px;bottom:calc(var(--sab) + 28px);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
#homeL .stats{display:flex;gap:8px}
.mbtn{display:flex;align-items:center;gap:9px;background:#fff;color:var(--navy);border:3px solid var(--navy);border-radius:16px;padding:10px 16px 10px 12px;font-weight:800;font-size:16px;box-shadow:0 4px 0 rgba(2,39,83,.35)}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(2,39,83,.35)}
.mbtn svg{width:22px;height:22px}
#play{right:16px;bottom:calc(var(--sab) + 46px);width:134px;height:134px}
#play b{font-size:40px}
#playSub{position:absolute;right:8px;bottom:calc(var(--sab) + 12px);width:150px;text-align:center;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.4);pointer-events:none}
/* LEVELS */
#levels{position:absolute;inset:0;background:var(--cream);display:flex;flex-direction:column}
#levels .hd{padding:calc(var(--sat) + 20px) 20px 14px;background:var(--red);color:#fff;border-bottom:4px solid var(--navy)}
#levels h2{font-size:52px;color:#fff;-webkit-text-stroke:2px var(--navy);paint-order:stroke fill;text-shadow:0 4px 0 var(--navy)}
#levels .pk{font-weight:700;margin-top:6px;display:flex;align-items:center;gap:10px;font-size:14px}
.bar{flex:1;height:12px;background:rgba(2,39,83,.35);border-radius:8px;overflow:hidden;max-width:180px}
.bar i{display:block;height:100%;background:var(--yel);border-radius:8px}
#grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:14px 16px calc(var(--sab) + 110px);display:flex;flex-direction:column;gap:10px}
.lv{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--navy);border-radius:18px;padding:10px 12px;text-align:left;box-shadow:0 4px 0 rgba(2,39,83,.25);width:100%}
.lv .num{width:46px;height:46px;flex:none;border-radius:14px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px}
.lv .info{flex:1;min-width:0}
.lv .nm{font-weight:800;font-size:17px}
.lv .nm i{font-style:normal;font-size:10px;letter-spacing:1px;background:#2fa84f;color:#fff;border-radius:6px;padding:2px 6px;vertical-align:2px;margin-left:4px}
.lv .meta{font-size:13px;opacity:.65;font-weight:600;margin-top:2px}
.lv .st{display:flex;gap:2px}.lv .st svg{width:20px;height:20px}
.lv.lock{opacity:.5;box-shadow:none}.lv.lock .num{background:#d9d4c8}
.lv.next{background:#fff3c4;border-color:var(--red)}.lv.next .num{background:var(--red)}
#back1{position:absolute;left:16px;bottom:calc(var(--sab) + 28px)}
/* END */
#end{position:absolute;inset:0;background:rgba(2,39,83,.5);display:flex;align-items:center;justify-content:center;padding:0 18px calc(var(--sab) + 120px)}
#end .card{background:var(--cream);border-radius:24px;padding:22px 20px 18px;width:100%;max-width:340px;text-align:center;border:4px solid var(--navy);box-shadow:0 8px 0 rgba(2,39,83,.35)}
#endT{font-size:62px}#endT.good{color:var(--red)}#endT.meh{color:var(--navy)}
#endW{font-size:15px;font-weight:600;margin-top:6px}
#endStars{display:flex;justify-content:center;gap:10px;margin-top:14px}
#endStars svg{width:56px;height:56px;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
#endStars svg.show{transform:scale(1)}
#endRows{margin-top:14px;text-align:left;font-size:14px}
#endRows .row{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:2px dashed rgba(2,39,83,.15);font-weight:600}
#endRows .tot{display:flex;justify-content:space-between;padding:8px 2px 0;font-weight:800;font-size:17px}
#endRows .tot b{color:#2fa84f}
#next{right:18px;bottom:calc(var(--sab) + 26px);width:118px;height:118px}
#next b{font-size:26px}
.lowbtns{position:absolute;left:16px;bottom:calc(var(--sab) + 28px);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
/* PAUSE + SETTINGS */
#pauseS,#setS{position:absolute;inset:0;background:rgba(2,39,83,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:120px}
#pauseS h2,#setS h2{font-size:64px;color:#fff;-webkit-text-stroke:2px var(--navy);paint-order:stroke fill;text-shadow:0 5px 0 var(--navy);margin-bottom:18px}
#resume{right:18px;bottom:calc(var(--sab) + 26px);width:112px;height:112px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:30px;width:260px;background:#fff;border:3px solid var(--navy);border-radius:16px;padding:14px 16px;font-weight:800;font-size:17px;margin-bottom:10px;box-shadow:0 4px 0 rgba(2,39,83,.35)}
.srow span:last-child{background:#2fa84f;color:#fff;border-radius:10px;padding:4px 10px;font-size:13px}
.srow.off span:last-child{background:#9aa3b2}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .3s}
</style></head><body>
@@INTRO@@
<div id="gl"></div>
<div class="layer" id="hud" hidden>
  <svg id="aimsvg"></svg>
  <div class="tl"><div class="pill"><span class="big" style="font-size:22px" id="lvN">1</span><span id="lvName">İlk Atış</span><span class="chip">PAR <span id="par">2</span></span></div><div id="hudFe"></div></div>
  <div class="tr"><div class="pill d" id="shotsBox"><small>ATIŞ</small><span class="big" id="shots">0</span></div><button class="pause" id="pauseB" aria-label="Duraklat"><i></i><i></i></button></div>
  <div id="wind"><div class="pill" style="font-size:14px">Rüzgâr <span class="big" style="font-size:20px" id="windV">→ 8</span></div></div>
  <div id="tut" hidden></div><div id="hint" hidden></div>
  <div id="toast"></div>
  <button id="mapB" aria-label="Harita"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>HARİTA</button>
  <div class="btn off" id="tuy" role="button" aria-label="Tüy aç"><svg id="tuyRing" viewBox="0 0 130 130"><circle cx="65" cy="65" r="60" fill="none" stroke="rgba(2,39,83,.15)" stroke-width="7"/><circle id="tuyArc" cx="65" cy="65" r="60" fill="none" stroke="#2fa84f" stroke-width="7" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="0" transform="rotate(-90 65 65)"/></svg><b>TÜY AÇ</b><small>basılı tut</small></div>
  <div id="flash"></div>
</div>
<div class="layer" id="homeL">
  <div class="top"><img class="logo" alt="FLIX" src="@@LOGO@@"><h1 class="big">ATIŞ</h1><div class="sub">MAHALLE GOLFÜ</div></div>
  <div class="bottom"></div>
  <div class="left">
    <div class="stats"><div class="pill"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21.1l1.5-7L2 9.3l7-.8z" fill="#ffc20e" stroke="#022753" stroke-width="2" stroke-linejoin="round"/></svg><span id="starsH">0</span></div><div class="pill"><svg width="16" height="18" viewBox="0 0 20 24"><path d="M10 23C3 15 4 6 10 1c6 5 7 14 0 22z" fill="#2fa84f" stroke="#022753" stroke-width="1.8"/></svg><span id="feH">0</span></div></div>
    <button class="mbtn" id="lvlB"><svg viewBox="0 0 24 24" fill="none" stroke="#022753" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Bölümler</button>
    <button class="mbtn" id="setB"><svg viewBox="0 0 24 24" fill="none" stroke="#022753" stroke-width="2.4"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M5.2 18.8l2.1-2.1M16.7 7.3l2.1-2.1" stroke-linecap="round"/></svg>Ayarlar</button>
  </div>
  <button class="btn" id="play"><b>OYNA</b></button>
  <div id="playSub"></div>
</div>
<div class="layer" id="levelsL" hidden>
  <div id="levels"><div class="hd"><h2 class="big">MAHALLE</h2><div class="pk"><span>Sokak 1 · 8 bölüm</span><div class="bar"><i id="lvProg"></i></div><span id="lvProgT"></span></div></div><div id="grid"></div></div>
  <button class="mbtn" id="back1">Geri</button>
</div>
<div class="layer" id="endL" hidden>
  <div id="end"><div class="card">
    <h2 class="big" id="endT">PAR!</h2><div id="endW"></div>
    <div id="endStars"></div><div id="endRows"></div></div></div>
  <div class="lowbtns"><button class="mbtn" id="retry3">Tekrar</button><button class="mbtn" id="menu3">Bölümler</button></div>
  <button class="btn" id="next"><b>SONRAKİ</b></button>
</div>
<div class="layer" id="pauseL" hidden>
  <div id="pauseS"><h2 class="big">MOLA</h2></div>
  <div class="lowbtns"><button class="mbtn" id="retryP">Yeniden başla</button><button class="mbtn" id="menu2">Bölümler</button><button class="mbtn" id="homeP">Ana ekran</button></div>
  <button class="btn" id="resume"><b>DEVAM</b></button>
</div>
<div class="layer" id="setL" hidden>
  <div id="setS"><h2 class="big">AYARLAR</h2>
    <button class="srow" id="sndRow"><span>Ses</span><span id="sndT">Açık</span></button>
    <button class="srow" id="vibRow"><span>Titreşim</span><span id="vibT">Açık</span></button></div>
  <button class="btn" id="setClose" style="right:18px;bottom:calc(var(--sab) + 26px);width:112px;height:112px"><b>TAMAM</b></button>
</div>
<script src="@@THREE@@"></script>
<script>
@@GAME@@
</script>
</body></html>
